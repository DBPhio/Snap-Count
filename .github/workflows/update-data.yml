name: Refresh NFL data
 
on:
  schedule:
    # Tuesdays 09:00 UTC — after Monday Night Football is final
    - cron: "0 9 * * 2"
  workflow_dispatch:        # lets you run it by hand any time
 
permissions:
  contents: write
 
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild data files
        run: python build_data.py
      - name: Commit if changed
        run: |
          git config user.name  "snap-count-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Refresh NFL data ($(date -u +%Y-%m-%d))"
          git push
