<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snap Count — NFL player stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1216; --surface:#171C22; --surface2:#1D242C; --rule:#252D37; --rule2:#333E4B;
  --chalk:#EAEEF3; --mid:#93A3B4; --dim:#5E6E80;
  --qb:#F4646E; --rb:#3FD0A0; --wr:#4C9AFF; --te:#FFB03A; --k:#B98CFF;
  --h0:#1C2531; --h1:#274C63; --h2:#2C6A8C; --h3:#D98A32; --h4:#FF5A36;
  --good:#3FD0A0; --warn:#FFB03A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--chalk);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--wr);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- masthead ---------- */
header{position:sticky;top:0;z-index:40;background:#0F1216;border-bottom:1px solid var(--rule)}
.mast{display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:9px;font-family:'Barlow Condensed',sans-serif}
.wordmark b{font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1}
.wordmark span{font-size:12px;color:var(--dim);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.hashes{display:flex;gap:3px;align-items:flex-end;height:20px}
.hashes i{width:2px;background:var(--rule2);display:block}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{padding:7px 13px;font-size:12.5px;color:var(--mid);font-weight:500}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--surface2);color:var(--chalk)}
.seg button:hover:not(.on){color:var(--chalk)}
.ctl{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:7px 11px;font-size:13px}
.ctl:hover{border-color:var(--rule2)}
select.ctl{cursor:pointer}
.savedot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;transition:background .2s}
.savedot.on{background:var(--good)} .savedot.busy{background:var(--warn)} .savedot.err{background:var(--qb)}
.who{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}

/* ---------- shell ---------- */
main{max-width:1560px;margin:0 auto;padding:20px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 12px;min-width:210px;flex:1;max-width:340px;font-size:13px}
.search::placeholder{color:var(--dim)}
.chip{padding:6px 11px;border:1px solid var(--rule);border-radius:20px;font-size:12px;color:var(--mid);font-family:'IBM Plex Mono',monospace}
.chip.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk);font-weight:600}
.chip:hover:not(.on){border-color:var(--rule2);color:var(--chalk)}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin-left:auto}

/* ---------- player tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.tile{content-visibility:auto;contain-intrinsic-size:214px;position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:15px 10px 10px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
.tile:hover{background:var(--surface2);border-color:var(--rule2)}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--pc);border-radius:11px 11px 0 0}
.por{width:74px;height:74px;margin:0 auto;border-radius:50%;overflow:hidden;background:#202935;border:2px solid var(--pc);display:flex;align-items:center;justify-content:center}
.por img{width:100%;height:100%;object-fit:cover;object-position:top center}
.por .ini{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--mid)}
.t-name{margin-top:9px;font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.t-meta{margin-top:5px;display:flex;justify-content:center;gap:6px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mid)}
.pos{font-weight:600;font-size:10px;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);border-radius:4px;padding:1px 5px}
.t-line{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.t-line b{color:var(--chalk);font-size:13px;font-weight:600}
/* heat strip — the signature element */
.strip{display:flex;gap:1.5px;margin-top:9px;height:16px}
.strip i{flex:1;border-radius:2px;background:var(--h0);display:block}
.strip i[data-h="1"]{background:var(--h1)} .strip i[data-h="2"]{background:var(--h2)}
.strip i[data-h="3"]{background:var(--h3)} .strip i[data-h="4"]{background:var(--h4)}
.strip i.dnp{background:repeating-linear-gradient(45deg,#1A2029,#1A2029 2px,transparent 2px,transparent 4px)}

/* ---------- data table ---------- */
.tbl-wrap{border:1px solid var(--rule);border-radius:11px;overflow:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--mid);font-weight:600;font-size:12px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;z-index:2}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--chalk)}
thead th.sorted{color:var(--chalk);box-shadow:inset 0 -2px 0 var(--wr)}
tbody td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
tbody td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.who-cell{display:flex;align-items:center;gap:12px;font-family:'IBM Plex Sans',sans-serif}
.who-cell .por{width:44px;height:44px;border-width:2px}
.tbl-wrap{contain:content}
.who-cell .por .ini{font-size:16px}
.who-cell b{font-weight:600;font-size:15.5px;line-height:1.25}
.sub{color:var(--mid);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-top:2px}
td.hot{color:var(--h4);font-weight:600}
td.zero{color:#3C4854}

/* ---------- filter workbench ---------- */
.work{display:grid;grid-template-columns:268px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.work{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:11px;overflow:hidden}
.panel-h{padding:11px 14px;border-bottom:1px solid var(--rule);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-h small{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);font-weight:400}
.fgroup{padding:12px 14px;border-bottom:1px solid var(--rule)}
.fgroup:last-child{border-bottom:none}
.flab{font-size:12.5px;color:var(--mid);margin-bottom:8px;font-family:'IBM Plex Mono',monospace}
.frow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.frow:last-child{margin-bottom:0}
.frow select,.frow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 9px;font-size:13.5px;font-family:'IBM Plex Mono',monospace}
.frow .x{color:var(--dim);font-size:13px;padding:0 2px}
.frow .x:hover{color:var(--qb)}
.preset{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:6px;font-size:13.5px;color:var(--mid);border:1px solid transparent}
.preset:hover{background:var(--surface2);color:var(--chalk);border-color:var(--rule)}
.addbtn{width:100%;padding:9px;border:1px dashed var(--rule2);border-radius:6px;font-size:13px;color:var(--mid);font-family:'IBM Plex Mono',monospace}
.addbtn:hover{color:var(--chalk);border-color:var(--chalk)}

/* ---------- detail sheet ---------- */
/* ---------- league cards ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(372px,1fr));gap:16px;align-items:start}
@media(max-width:520px){.lgrid{grid-template-columns:1fr}}
.lcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.lhead{display:flex;align-items:center;gap:6px;padding:11px 12px;border-bottom:1px solid var(--rule)}
.lname{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:6px;padding:4px 7px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600}
.lname:hover{border-color:var(--rule)}
.lname:focus{border-color:var(--wr);outline:none;background:var(--ink)}
.lbtn{color:var(--dim);font-size:15px;padding:5px 7px;border-radius:6px}
.lbtn:hover{color:var(--chalk);background:var(--surface2)}
.lcfg{padding:12px 14px;background:var(--ink);border-bottom:1px solid var(--rule)}
.slotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slotf{display:flex;flex-direction:column;gap:4px;align-items:center}
.slotf span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mid)}
.slotf input{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px}
.lnote{margin-top:9px;font-size:11px;color:var(--dim);line-height:1.45}
.lkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule)}
.lkpi{background:var(--surface);padding:11px 8px;text-align:center}
.lkpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.1}
.lkpi span{font-size:10px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lchart{display:flex;align-items:flex-end;gap:3px;padding:14px 12px 8px;border-bottom:1px solid var(--rule)}
.lbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.lbar i{width:100%;background:var(--h2);border-radius:2px 2px 0 0;display:block;transition:background .12s}
.lbar span{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim)}
.lbar:hover i{background:var(--h3)}
.lbar.on i{background:var(--h4)} .lbar.on span{color:var(--chalk)}
.lcall{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:11px}
.lcall .up{color:var(--good)} .lcall .dn{color:var(--qb)}
.lcall em{color:var(--dim);font-style:normal}
.lineup{padding:6px 0}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 12px}
.lrow:hover{background:var(--surface2)}
.lrow.bench{opacity:.72}
.lslot{width:38px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mid);background:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:3px 0;text-align:center}
.lslot.flex{color:var(--te);border-color:color-mix(in srgb,var(--te) 40%,transparent)}
.lslot.bn{color:var(--dim)}
.lrow .por{width:30px;height:30px;border-width:1.5px}
.lrow .por .ini{font-size:11px}
.lnm{flex:1;min-width:0;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnm em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lnm:hover{color:var(--wr)}
.lnm.empty{color:var(--dim);font-weight:400;font-style:italic;cursor:default}
.lpts{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;min-width:42px;text-align:right}
.lpts.dnp{color:#3C4854;font-weight:400}
.lx{color:transparent;font-size:11px;padding:2px 4px}
.lrow:hover .lx{color:var(--dim)}
.lx:hover{color:var(--qb)}
.lbench{padding:8px 12px 4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);border-top:1px solid var(--rule);margin-top:4px}
.lempty{padding:20px 12px;text-align:center;color:var(--dim);font-size:12.5px}
.ladd{padding:10px 12px;border-top:1px solid var(--rule);position:relative}
.lsearch{width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:7px;padding:9px 11px;font-size:13px}
.lsearch:focus{border-color:var(--wr);outline:none}
.lres{margin-top:6px}
.lhit{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:13px}
.lhit:hover{background:var(--surface2)}
.lhit .por{width:28px;height:28px;border-width:1.5px}
.lhit .por .ini{font-size:10px}
.lhit em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lhit.none{color:var(--dim);font-size:12px;padding:8px}
.veil{position:fixed;inset:0;background:rgba(8,10,13,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.veil.show{display:flex}
.sheet{background:var(--surface);border:1px solid var(--rule2);border-radius:14px;max-width:880px;width:100%;max-height:88vh;overflow:auto}
.sheet-h{display:flex;gap:15px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h .por{width:64px;height:64px}
.sheet-h h2{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1.05}
.sheet-sub{display:flex;gap:9px;align-items:center;margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mid);flex-wrap:wrap}
.closeb{margin-left:auto;align-self:flex-start;color:var(--dim);font-size:17px;padding:3px 7px}
.closeb:hover{color:var(--chalk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.sect{padding:16px 20px}
.sect h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;margin-bottom:11px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3 small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);font-weight:400}
.empty{padding:34px 20px;text-align:center;color:var(--dim);font-size:13px}
.legend{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.legend i{width:15px;height:9px;border-radius:2px;display:block}
.loading{padding:44px;text-align:center;color:var(--mid);font-family:'IBM Plex Mono',monospace;font-size:13px}
footer{max-width:1560px;margin:0 auto;padding:22px 20px 40px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--rule);margin-top:30px;line-height:1.7}
footer a{color:var(--mid)}
</style>
</head>
<body>
<header>
  <div class="mast">
    <div class="wordmark">
      <div class="hashes" aria-hidden="true"><i style="height:9px"></i><i style="height:15px"></i><i style="height:20px"></i><i style="height:13px"></i></div>
      <b>SNAP COUNT</b><span id="seasonTag">2026</span>
    </div>
    <div class="seg" id="viewSeg">
      <button data-v="players" class="on">Players</button>
      <button data-v="finder">Stat finder</button>
      <button data-v="leagues">My leagues</button>
    </div>
    <div class="grow"></div>
    <select class="ctl" id="seasonSel"><option value="2026">2026 season</option><option value="2025">2025 season</option></select>
    <div class="seg" id="scoreSeg">
      <button data-s="ppr" class="on">PPR</button>
      <button data-s="half">Half</button>
      <button data-s="std">Std</button>
    </div>
    <span class="savedot" id="saveDot" title="Not saved yet"></span>
  </div>
</header>
<main>
  <div id="view-players"></div>
  <div id="view-finder" style="display:none"></div>
  <div id="view-leagues" style="display:none"></div>
</main>
<footer>
  <div>Snap Count — active-roster offensive players and kickers, every week of the season.</div>
  <div id="dataNote">Loading data…</div>
</footer>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

const TEAMS={ARI:"#97233F",ATL:"#A71930",BAL:"#241773",BUF:"#00338D",CAR:"#0085CA",CHI:"#0B162A",CIN:"#FB4F14",CLE:"#311D00",DAL:"#003594",DEN:"#FB4F14",DET:"#0076B6",GB:"#203731",HOU:"#03202F",IND:"#002C5F",JAX:"#006778",KC:"#E31837",LA:"#003594",LAR:"#003594",LAC:"#0080C6",LV:"#A5ACAF",MIA:"#008E97",MIN:"#4F2683",NE:"#002244",NO:"#D3BC8D",NYG:"#0B2265",NYJ:"#125740",PHI:"#004C54",PIT:"#FFB612",SEA:"#69BE28",SF:"#AA0000",TB:"#D50A0A",TEN:"#4B92DB",WAS:"#5A1414"};
const PC={QB:"var(--qb)",RB:"var(--rb)",WR:"var(--wr)",TE:"var(--te)",K:"var(--k)"};
// weekly row layout
const C={id:0,wk:1,tm:2,opp:3,cmp:4,att:5,pyd:6,ptd:7,int:8,car:9,ryd:10,rtd:11,tgt:12,rec:13,cyd:14,ctd:15,fum:16,fg:17,pat:18,std:19,ppr:20};

let season=2026, scoring="ppr", view="players";
let P={}, W={};                       // players keyed by gsis, weekly rows by season
let idx={};                           // season -> {pid: [rows]}
let q="", posF="ALL", teamF="ALL";
let filters=[], sortKey="fp", sortDir=-1, weekF="all";
let loaded=false;

/* ---------- data loading ---------- */
async function boot(){
  P=PLAYERS; W=WK;
  reindex(); loaded=true; loadPrefs(); loadLeagues(); render();   // paint immediately from the bundle
  if(!DATA_BASE){ note("Bundled snapshot — set DATA_BASE for weekly auto-refresh"); return; }
  // Then refresh in the background, and only pull files that actually changed.
  try{
    const meta=await fetch(DATA_BASE+"/meta.json",{cache:"no-cache"}).then(r=>r.json());
    if(meta.built&&meta.built===BUILT){ note("Live data · already current"); return; }
    const [pr,w26,w25]=await Promise.all([
      fetch(DATA_BASE+"/players.json").then(r=>r.json()),
      fetch(DATA_BASE+"/weekly_2026.json").then(r=>r.json()),
      fetch(DATA_BASE+"/weekly_2025.json").then(r=>r.json())
    ]);
    if(pr&&Object.keys(pr).length) P=pr;
    if(w26&&w26.rows) W[2026]=w26.rows;
    if(w25&&w25.rows) W[2025]=w25.rows;
    reindex(); invalidate(); porCache.clear(); _teamOpts=""; _weekCache={};
    note("Live data · refreshed from your repo");
    render();
  }catch(e){ console.warn("Live refresh failed; bundled snapshot still in use:",e); note("Bundled snapshot — live refresh unavailable"); }
}
function note(t){
  const wks=weeksIn(season);
  document.getElementById("dataNote").textContent=
    t+" · "+Object.keys(P).length+" active players · "+season+": "+(wks.length?("weeks "+wks[0]+"–"+wks[wks.length-1]):"no games yet");
}
function reindex(){
  idx={};
  for(const s of [2026,2025]){
    const m={};
    for(const r of (W[s]||[])) (m[r[C.id]]=m[r[C.id]]||[]).push(r);
    for(const k in m) m[k].sort((a,b)=>a[C.wk]-b[C.wk]);
    idx[s]=m;
  }
}
const weeksIn=s=>[...new Set((W[s]||[]).map(r=>r[C.wk]))].sort((a,b)=>a-b);
const logOf=(pid,s)=>(idx[s||season]||{})[pid]||[];
function fp(r){ return scoring==="ppr"?r[C.ppr] : scoring==="std"?r[C.std] : Math.round((r[C.ppr]+r[C.std])/2*10)/10; }
const tds=r=>r[C.ptd]+r[C.rtd]+r[C.ctd];
const yds=r=>r[C.pyd]+r[C.ryd]+r[C.cyd];
const scrim=r=>r[C.ryd]+r[C.cyd];

/* ---------- portraits ---------- */
function initials(n){ const p=n.split(" "); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
// NFL images are Cloudinary-backed: ask for a thumbnail instead of the full
// asset. 524 portraits at full size is the single biggest load on this page.
function thumb(url,px){
  if(!url) return url;
  const t="f_auto,q_auto,w_"+px+",h_"+px+",c_fill,g_face";
  if(url.includes("/image/upload/f_auto,q_auto/")) return url.replace("/image/upload/f_auto,q_auto/","/image/upload/"+t+"/");
  if(url.includes("/image/upload/")) return url.replace("/image/upload/","/image/upload/"+t+"/");
  return url;
}
const porCache=new Map();
function por(pid,cls){
  const key=pid+"|"+(cls||"");
  let v=porCache.get(key);
  if(v!==undefined) return v;
  const p=P[pid];
  if(!p) return "";
  const col=TEAMS[p.t]||"#2A3542";
  const px=cls==="sm"?96:160;   // 2x the 44px table portrait for retina
  const img=p.h?'<img loading="lazy" decoding="async" width="'+px+'" height="'+px+'" src="'+thumb(p.h,px)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ini\',textContent:\''+initials(p.n)+'\'}))">':'<span class="ini">'+initials(p.n)+'</span>';
  v='<div class="por '+(cls||'')+'" style="--pc:'+(PC[p.p]||col)+'">'+img+'</div>';
  porCache.set(key,v);
  return v;
}

/* ---------- heat ---------- */
function heatOf(v,max){ if(v<=0) return 0; const r=v/(max||1); return r<.25?1:r<.5?2:r<.75?3:4; }
let _stripCache=new Map();
function stripHtml(pid){
  const k=pid+"|"+season+"|"+scoring;
  const hit=_stripCache.get(k);
  if(hit!==undefined) return hit;
  const v=computeStrip(pid);
  _stripCache.set(k,v);
  return v;
}
let _weekCache={};
function computeStrip(pid){
  const log=logOf(pid), wks=(_weekCache[season]=_weekCache[season]||weeksIn(season));
  if(!wks.length) return '<div class="strip"></div>';   // no games charted yet
  const vals=log.map(fp), max=Math.max(...vals,1);
  const by={}; log.forEach(r=>by[r[C.wk]]=fp(r));
  let h='<div class="strip">';
  for(const w of wks){
    if(w in by) h+='<i data-h="'+heatOf(by[w],max)+'" title="Week '+w+': '+by[w].toFixed(1)+'"></i>';
    else h+='<i class="dnp" title="Week '+w+': did not play"></i>';
  }
  return h+'</div>';
}

/* =================== Players view =================== */
let _tCache=new Map(), _tKey="";
function totalsKey(){ return season+"|"+scoring; }
function invalidate(){ _tCache=new Map(); _stripCache=new Map(); }
function seasonTotals(pid){
  const k=totalsKey();
  if(k!==_tKey){ _tCache=new Map(); _tKey=k; }
  const hit=_tCache.get(pid);
  if(hit) return hit;
  const v=computeTotals(pid);
  _tCache.set(pid,v);
  return v;
}
function computeTotals(pid){
  const log=logOf(pid);
  const t={g:log.length,fp:0,pyd:0,ptd:0,ryd:0,rtd:0,cyd:0,ctd:0,rec:0,td:0};
  log.forEach(r=>{ t.fp+=fp(r); t.pyd+=r[C.pyd]; t.ptd+=r[C.ptd]; t.ryd+=r[C.ryd]; t.rtd+=r[C.rtd];
    t.cyd+=r[C.cyd]; t.ctd+=r[C.ctd]; t.rec+=r[C.rec]; t.td+=tds(r); });
  t.ppg=t.g?t.fp/t.g:0;
  return t;
}
function playerList(){
  return Object.keys(P).filter(id=>{
    const p=P[id];
    if(posF!=="ALL"&&p.p!==posF) return false;
    if(teamF!=="ALL"&&p.t!==teamF) return false;
    if(q){ const s=q.toLowerCase(); if(!(p.n.toLowerCase().includes(s)||p.t.toLowerCase().includes(s))) return false; }
    return true;
  });
}
let shown=120;                       // tiles rendered so far (grows on scroll)
const PAGE=120;
let _teamOpts="";
function renderPlayers(){
  const host=document.getElementById("view-players");
  if(!_teamOpts){
    const teams=[...new Set(Object.values(P).map(p=>p.t))].sort();
    _teamOpts=teams.map(t=>'<option>'+t+'</option>').join('');
  }
  // Precompute totals once, then sort on the plain numbers. Calling
  // seasonTotals() from inside the comparator re-derives them O(n log n) times.
  const all=playerList();
  const fpOf=new Map(all.map(id=>[id,seasonTotals(id).fp]));
  const ids=all.sort((a,b)=>fpOf.get(b)-fpOf.get(a)||P[a].n.localeCompare(P[b].n));
  let h='<div class="bar">'
    +'<input class="search" id="q" placeholder="Search player or team" value="'+q.replace(/"/g,"&quot;")+'">'
    +['ALL','QB','RB','WR','TE','K'].map(x=>'<button class="chip '+(posF===x?'on':'')+'" data-p="'+x+'">'+(x==='ALL'?'All':x)+'</button>').join('')
    +'<select class="ctl" id="teamF"><option value="ALL">All teams</option>'+_teamOpts+'</select>'
    +'<span class="count">'+ids.length+' players</span></div>';
  if(!ids.length) h+='<div class="empty">Nobody matches those filters. Clear the search or pick another position.</div>';
  else{
    const page=ids.slice(0,shown);
    h+='<div class="grid">';
    for(const id of page){
      const p=P[id], t=seasonTotals(id);
      h+='<div class="tile" data-id="'+id+'" style="--pc:'+(PC[p.p]||'var(--rule2)')+'">'
        +por(id,"")
        +'<div class="t-name">'+p.n+'</div>'
        +'<div class="t-meta"><span class="pos">'+p.p+'</span><span>'+p.t+(p.j?' · '+p.j:'')+'</span></div>'
        +stripHtml(id)
        +'<div class="t-line">'+(t.g?'<b>'+t.ppg.toFixed(1)+'</b> ppg · '+t.g+' gm · '+t.td+' TD':'no games yet')+'</div>'
        +'</div>';
    }
    h+='</div>';
    if(ids.length>shown) h+='<div id="sentinel" style="height:1px"></div><div style="text-align:center;padding:16px"><button class="ctl" id="more">Show more ('+(ids.length-shown)+' left)</button></div>';
  }
  host.innerHTML=h;
  const qi=document.getElementById("q");
  qi.value=q;
  document.getElementById("teamF").value=teamF;
  let qt;
  qi.oninput=e=>{ const v=e.target.value.trim(); clearTimeout(qt);
    qt=setTimeout(()=>{ q=v; shown=PAGE; renderPlayers(); document.getElementById("q").focus(); savePrefs(); },180); };
  document.getElementById("teamF").onchange=e=>{ teamF=e.target.value; shown=PAGE; renderPlayers(); savePrefs(); };
  const more=document.getElementById("more");
  if(more) more.onclick=()=>{ shown+=PAGE; renderPlayers(); };
  const sent=document.getElementById("sentinel");
  if(sent&&"IntersectionObserver" in window){
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ io.disconnect(); shown+=PAGE; renderPlayers(); } },{rootMargin:"600px"});
    io.observe(sent);
  }
  host.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ posF=c.dataset.p; shown=PAGE; renderPlayers(); savePrefs(); });
  host.querySelectorAll(".tile").forEach(t=>t.onclick=()=>openSheet(t.dataset.id));
}

/* =================== Stat finder =================== */
const FIELDS=[
  {k:"fp",  label:"Fantasy points", get:fp},
  {k:"td",  label:"Total TDs",      get:tds},
  {k:"yds", label:"Total yards",    get:yds},
  {k:"scrim",label:"Scrimmage yards",get:scrim},
  {k:"pyd", label:"Passing yards",  get:r=>r[C.pyd]},
  {k:"ptd", label:"Passing TDs",    get:r=>r[C.ptd]},
  {k:"int", label:"Interceptions",  get:r=>r[C.int]},
  {k:"ryd", label:"Rushing yards",  get:r=>r[C.ryd]},
  {k:"rtd", label:"Rushing TDs",    get:r=>r[C.rtd]},
  {k:"car", label:"Carries",        get:r=>r[C.car]},
  {k:"cyd", label:"Receiving yards",get:r=>r[C.cyd]},
  {k:"ctd", label:"Receiving TDs",  get:r=>r[C.ctd]},
  {k:"rec", label:"Receptions",     get:r=>r[C.rec]},
  {k:"tgt", label:"Targets",        get:r=>r[C.tgt]},
  {k:"fum", label:"Fumbles lost",   get:r=>r[C.fum]},
  {k:"fg",  label:"Field goals",    get:r=>r[C.fg]}
];
const F=k=>FIELDS.find(f=>f.k===k);
const PRESETS=[
  {n:"Scored a touchdown",       f:[{k:"td",op:">=",v:1}],    s:"td"},
  {n:"Multi-TD games",           f:[{k:"td",op:">=",v:2}],    s:"td"},
  {n:"100+ rushing yards",       f:[{k:"ryd",op:">=",v:100}], s:"ryd"},
  {n:"100+ receiving yards",     f:[{k:"cyd",op:">=",v:100}], s:"cyd"},
  {n:"300+ passing yards",       f:[{k:"pyd",op:">=",v:300}], s:"pyd"},
  {n:"10+ targets",              f:[{k:"tgt",op:">=",v:10}],  s:"tgt"},
  {n:"20+ fantasy points",       f:[{k:"fp",op:">=",v:20}],   s:"fp"},
  {n:"Turnover trouble",         f:[{k:"fum",op:">=",v:1}],   s:"fum"}
];
function finderRows(){
  const out=[];
  for(const r of (W[season]||[])){
    if(!P[r[C.id]]) continue;
    if(weekF!=="all"&&r[C.wk]!==+weekF) continue;
    const p=P[r[C.id]];
    if(posF!=="ALL"&&p.p!==posF) continue;
    if(teamF!=="ALL"&&p.t!==teamF) continue;
    if(q){ const s=q.toLowerCase(); if(!(p.n.toLowerCase().includes(s)||p.t.toLowerCase().includes(s))) continue; }
    let ok=true;
    for(const f of filters){
      const fd=F(f.k); if(!fd) continue;
      const v=fd.get(r), n=+f.v||0;
      if(f.op===">="&&!(v>=n)) ok=false;
      else if(f.op==="<="&&!(v<=n)) ok=false;
      else if(f.op==="=="&&!(v===n)) ok=false;
      if(!ok) break;
    }
    if(ok) out.push(r);
  }
  const sf=F(sortKey);
  out.sort((a,b)=>{ const d=(sf?sf.get(b):fp(b))-(sf?sf.get(a):fp(a)); return sortDir<0?d:-d; });
  return out;
}
const COLS=[
  {k:"wk",label:"Wk",get:r=>r[C.wk]},
  {k:"fp",label:"FP",get:fp,fx:1},
  {k:"td",label:"TD",get:tds},
  {k:"pyd",label:"Pass",get:r=>r[C.pyd]},
  {k:"ptd",label:"PTD",get:r=>r[C.ptd]},
  {k:"car",label:"Car",get:r=>r[C.car]},
  {k:"ryd",label:"Rush",get:r=>r[C.ryd]},
  {k:"rtd",label:"RTD",get:r=>r[C.rtd]},
  {k:"tgt",label:"Tgt",get:r=>r[C.tgt]},
  {k:"rec",label:"Rec",get:r=>r[C.rec]},
  {k:"cyd",label:"RecYd",get:r=>r[C.cyd]},
  {k:"ctd",label:"RTD",get:r=>r[C.ctd]}
];
function renderFinder(){
  const host=document.getElementById("view-finder");
  const wks=weeksIn(season);
  const teams=[...new Set(Object.values(P).map(p=>p.t))].sort();
  const rows=finderRows();
  let h='<div class="bar">'
    +'<input class="search" id="fq" placeholder="Search player or team" value="'+q.replace(/"/g,"&quot;")+'">'
    +['ALL','QB','RB','WR','TE','K'].map(x=>'<button class="chip '+(posF===x?'on':'')+'" data-p="'+x+'">'+(x==='ALL'?'All':x)+'</button>').join('')
    +'<select class="ctl" id="fteam"><option value="ALL">All teams</option>'+teams.map(t=>'<option '+(teamF===t?'selected':'')+'>'+t+'</option>').join('')+'</select>'
    +'<span class="count">'+rows.length+' stat line'+(rows.length===1?'':'s')+'</span></div>';
  h+='<div class="work"><div class="panel">'
    +'<div class="panel-h">Filters<small>'+rows.length+' lines</small></div>'
    +'<div class="fgroup"><div class="flab">Week</div><div class="frow"><select id="weekF"><option value="all">All weeks</option>'
      +wks.map(w=>'<option value="'+w+'" '+(weekF==String(w)?'selected':'')+'>Week '+w+'</option>').join('')+'</select></div></div>'
    +'<div class="fgroup"><div class="flab">Conditions</div>';
  filters.forEach((f,i)=>{
    h+='<div class="frow"><select data-fi="'+i+'" data-fp="k">'+FIELDS.map(x=>'<option value="'+x.k+'" '+(f.k===x.k?'selected':'')+'>'+x.label+'</option>').join('')+'</select>'
      +'<select data-fi="'+i+'" data-fp="op" style="flex:0 0 52px">'+['>=','<=','=='].map(o=>'<option '+(f.op===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'
      +'<input data-fi="'+i+'" data-fp="v" style="flex:0 0 58px" value="'+f.v+'" inputmode="numeric">'
      +'<button class="x" data-del="'+i+'" title="Remove">✕</button></div>';
  });
  h+='<button class="addbtn" id="addF">+ add condition</button></div>'
    +'<div class="fgroup"><div class="flab">Quick views</div>'
    +PRESETS.map((p,i)=>'<button class="preset" data-preset="'+i+'">'+p.n+'</button>').join('')
    +'</div></div>';
  // results
  h+='<div class="panel"><div class="panel-h">Results<small>sorted by '+(F(sortKey)||{label:"Fantasy points"}).label.toLowerCase()+'</small></div>';
  if(!wks.length) h+='<div class="empty">No '+season+' games are in the books yet. Switch to 2025 for a full season of data.</div>';
  else if(!rows.length) h+='<div class="empty">No stat lines match. Loosen a condition or pick a different week.</div>';
  else{
    h+='<div class="tbl-wrap"><table><thead><tr><th class="l">Player</th>'
      +COLS.map(c=>'<th data-sort="'+c.k+'" class="'+(sortKey===c.k?'sorted':'')+'">'+c.label+'</th>').join('')+'</tr></thead><tbody>';
    for(const r of rows.slice(0,150)){
      const p=P[r[C.id]];
      h+='<tr data-id="'+r[C.id]+'"><td class="l"><div class="who-cell">'+por(r[C.id],"sm")
        +'<div><b>'+p.n+'</b><div class="sub">'+p.p+' · '+r[C.tm]+' vs '+r[C.opp]+'</div></div></div></td>'
        +COLS.map(c=>{ const v=c.get(r); const big=(c.k==="td"&&v>=2)||(c.k==="fp"&&v>=25)||((c.k==="ryd"||c.k==="cyd")&&v>=100)||(c.k==="pyd"&&v>=300);
          return '<td class="'+(big?'hot':(v?'':'zero'))+'">'+(v?(c.fx?v.toFixed(1):v):'–')+'</td>'; }).join('')
        +'</tr>';
    }
    h+='</tbody></table></div>';
    if(rows.length>150) h+='<div style="padding:10px 14px;color:var(--dim);font-size:11.5px;font-family:\'IBM Plex Mono\',monospace">Showing the top 150 of '+rows.length+' matching lines.</div>';
  }
  h+='</div></div>';
  host.innerHTML=h;

  const fq=document.getElementById("fq");
  fq.value=q;
  let ft;
  fq.oninput=e=>{ const v=e.target.value.trim(); clearTimeout(ft);
    ft=setTimeout(()=>{ q=v; renderFinder(); const n=document.getElementById("fq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); savePrefs(); },180); };
  host.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ posF=c.dataset.p; renderFinder(); savePrefs(); });
  document.getElementById("fteam").onchange=e=>{ teamF=e.target.value; renderFinder(); savePrefs(); };
  document.getElementById("weekF").onchange=e=>{ weekF=e.target.value; renderFinder(); savePrefs(); };
  document.getElementById("addF").onclick=()=>{ filters.push({k:"td",op:">=",v:1}); renderFinder(); savePrefs(); };
  host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ filters.splice(+b.dataset.del,1); renderFinder(); savePrefs(); });
  host.querySelectorAll("[data-fi]").forEach(el=>{
    const ev=el.tagName==="INPUT"?"change":"change";
    el.addEventListener(ev,()=>{ filters[+el.dataset.fi][el.dataset.fp]=el.value; renderFinder(); savePrefs(); });
  });
  host.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    const pr=PRESETS[+b.dataset.preset];
    filters=pr.f.map(x=>({...x})); sortKey=pr.s; sortDir=-1; renderFinder(); savePrefs();
  });
  host.querySelectorAll("[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=-1; }
    renderFinder(); savePrefs();
  });
  host.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>openSheet(tr.dataset.id));
}

/* =================== My leagues =================== */
const LS_L="snapcount.leagues";
let leagues=[], leagueWeek={};          // leagueWeek[id] = week being viewed
const SLOT_KEYS=["QB","RB","WR","TE","FLEX","K"];
const FLEX_OK=["RB","WR","TE"];

function loadLeagues(){
  try{ const v=JSON.parse(localStorage.getItem(LS_L)||"[]"); if(Array.isArray(v)) leagues=v; }catch(e){}
}
function saveLeagues(){
  const dot=document.getElementById("saveDot"); dot.className="savedot busy";
  try{ localStorage.setItem(LS_L,JSON.stringify(leagues)); dot.className="savedot on"; dot.title="Leagues saved in this browser"; }
  catch(e){ dot.className="savedot err"; dot.title="Couldn't save leagues"; }
}
function newLeague(){
  return {id:"L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          name:"League "+(leagues.length+1), scoring:"ppr",
          slots:{QB:1,RB:2,WR:2,TE:1,FLEX:1,K:1}, roster:[]};
}
// points for one stat line under an explicit scoring mode
function fpMode(r,mode){
  return mode==="ppr"?r[C.ppr] : mode==="std"?r[C.std] : Math.round((r[C.ppr]+r[C.std])/2*10)/10;
}
/* Optimal lineup for one week: fill dedicated slots with the best at each
   position, then FLEX takes the best remaining RB/WR/TE. */
function lineupFor(lg,wk){
  const pool=[];
  for(const pid of lg.roster){
    const p=P[pid]; if(!p) continue;
    const row=logOf(pid).find(r=>r[C.wk]===wk);
    pool.push({pid,pos:p.p,pts:row?fpMode(row,lg.scoring):0,played:!!row});
  }
  const used=new Set(), start=[];
  for(const slot of SLOT_KEYS){
    const n=lg.slots[slot]||0;
    for(let i=0;i<n;i++){
      const ok=c=>slot==="FLEX"?FLEX_OK.includes(c.pos):c.pos===slot;
      const best=pool.filter(c=>!used.has(c.pid)&&ok(c)).sort((a,b)=>b.pts-a.pts)[0];
      if(best){ used.add(best.pid); start.push({slot,...best}); }
      else start.push({slot,pid:null,pts:0});
    }
  }
  const bench=pool.filter(c=>!used.has(c.pid)).sort((a,b)=>b.pts-a.pts);
  const total=start.reduce((s,x)=>s+x.pts,0);
  return {start,bench,total};
}
function leagueSeason(lg){
  const wks=weeksIn(season);
  const byWeek=wks.map(w=>({w,total:lineupFor(lg,w).total}));
  const played=byWeek.filter(x=>x.total>0);
  const total=byWeek.reduce((s,x)=>s+x.total,0);
  // best / worst single starter performance across the season
  let best=null,worst=null;
  for(const w of wks){
    for(const s of lineupFor(lg,w).start){
      if(!s.pid||!s.played) continue;
      if(!best||s.pts>best.pts) best={...s,w};
      if(!worst||s.pts<worst.pts) worst={...s,w};
    }
  }
  return {byWeek,total,ppg:played.length?total/played.length:0,weeksPlayed:played.length,best,worst};
}
function renderLeagues(){
  const host=document.getElementById("view-leagues");
  const wks=weeksIn(season);
  if(!leagues.length){
    host.innerHTML='<div class="empty" style="padding:56px 20px">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:24px;color:var(--chalk);margin-bottom:8px">No leagues yet</div>'
      +'<div style="margin-bottom:18px">Add a card for each league you play in. Every card keeps its own scoring and roster slots.</div>'
      +'<button class="ctl" id="addLg" style="font-size:14px;padding:10px 18px">+ Add a league</button></div>';
    document.getElementById("addLg").onclick=()=>{ leagues.push(newLeague()); saveLeagues(); renderLeagues(); };
    return;
  }
  let h='<div class="bar"><span class="count" style="margin:0">'+leagues.length+' league'+(leagues.length===1?'':'s')+' · '+season+'</span>'
    +'<div class="grow"></div><button class="ctl" id="addLg">+ Add league</button></div><div class="lgrid">';
  for(const lg of leagues){
    const wk=leagueWeek[lg.id]||(wks.length?wks[wks.length-1]:0);
    const lu=wks.length?lineupFor(lg,wk):{start:[],bench:[],total:0};
    const ss=leagueSeason(lg);
    const maxW=Math.max(...ss.byWeek.map(x=>x.total),1);
    h+='<div class="lcard" data-lg="'+lg.id+'">'
      +'<div class="lhead"><input class="lname" data-name="'+lg.id+'" value="'+lg.name.replace(/"/g,"&quot;")+'" spellcheck="false">'
      +'<button class="lbtn" data-cfg="'+lg.id+'" title="League settings">⚙</button>'
      +'<button class="lbtn" data-del="'+lg.id+'" title="Delete league">✕</button></div>';
    // settings drawer
    if(lg.open) h+='<div class="lcfg"><div class="flab">Scoring</div><div class="frow">'
      +'<select data-sc="'+lg.id+'">'+[["ppr","Full PPR"],["half","Half PPR"],["std","Standard"]].map(([v,l])=>'<option value="'+v+'" '+(lg.scoring===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>'
      +'<div class="flab" style="margin-top:10px">Starting slots</div><div class="slotgrid">'
      +SLOT_KEYS.map(k=>'<label class="slotf"><span>'+k+'</span><input type="number" min="0" max="4" value="'+(lg.slots[k]||0)+'" data-slot="'+lg.id+'|'+k+'"></label>').join('')
      +'</div><div class="lnote">Team defenses aren\'t in the stats feed yet, so there\'s no D/ST slot.</div></div>';
    // KPIs
    h+='<div class="lkpis">'
      +'<div class="lkpi"><b>'+lu.total.toFixed(1)+'</b><span>week '+wk+'</span></div>'
      +'<div class="lkpi"><b>'+ss.total.toFixed(0)+'</b><span>season</span></div>'
      +'<div class="lkpi"><b>'+ss.ppg.toFixed(1)+'</b><span>ppg</span></div>'
      +'<div class="lkpi"><b>'+lg.roster.length+'</b><span>rostered</span></div></div>';
    // weekly chart
    if(wks.length){
      h+='<div class="lchart">'+ss.byWeek.map(x=>'<div class="lbar'+(x.w===wk?' on':'')+'" data-jump="'+lg.id+'|'+x.w+'" title="Week '+x.w+': '+x.total.toFixed(1)+'">'
        +'<i style="height:'+Math.max(2,Math.round(x.total/maxW*46))+'px"></i><span>'+x.w+'</span></div>').join('')+'</div>';
    }
    // callouts
    if(ss.best) h+='<div class="lcall"><span class="up">▲ '+P[ss.best.pid].n+' '+ss.best.pts.toFixed(1)+' <em>wk '+ss.best.w+'</em></span>'
      +(ss.worst?'<span class="dn">▼ '+P[ss.worst.pid].n+' '+ss.worst.pts.toFixed(1)+' <em>wk '+ss.worst.w+'</em></span>':'')+'</div>';
    // lineup
    if(!lg.roster.length){
      h+='<div class="lempty">No players yet — search below to build your roster.</div>';
    }else{
      h+='<div class="lineup">';
      for(const s of lu.start){
        h+='<div class="lrow">'+'<span class="lslot '+(s.slot==="FLEX"?"flex":"")+'">'+s.slot+'</span>'
          +(s.pid?por(s.pid,"sm")+'<span class="lnm" data-open="'+s.pid+'">'+P[s.pid].n+'<em>'+P[s.pid].p+' · '+P[s.pid].t+'</em></span>'
                 +'<span class="lpts'+(s.played?'':' dnp')+'">'+(s.played?s.pts.toFixed(1):'–')+'</span>'
                 +'<button class="lx" data-drop="'+lg.id+'|'+s.pid+'" title="Remove">✕</button>'
            : '<span class="lnm empty">empty</span><span class="lpts dnp">–</span>')
          +'</div>';
      }
      if(lu.bench.length){
        h+='<div class="lbench">Bench</div>';
        for(const b of lu.bench){
          h+='<div class="lrow bench"><span class="lslot bn">BN</span>'+por(b.pid,"sm")
            +'<span class="lnm" data-open="'+b.pid+'">'+P[b.pid].n+'<em>'+P[b.pid].p+' · '+P[b.pid].t+'</em></span>'
            +'<span class="lpts'+(b.played?'':' dnp')+'">'+(b.played?b.pts.toFixed(1):'–')+'</span>'
            +'<button class="lx" data-drop="'+lg.id+'|'+b.pid+'" title="Remove">✕</button></div>';
        }
      }
      h+='</div>';
    }
    // add player
    h+='<div class="ladd"><input class="lsearch" data-add="'+lg.id+'" placeholder="Add a player…" autocomplete="off">'
      +'<div class="lres" id="res-'+lg.id+'"></div></div>';
    h+='</div>';
  }
  h+='</div>';
  host.innerHTML=h;
  wireLeagues(host,wks);
}
function wireLeagues(host,wks){
  const L=id=>leagues.find(x=>x.id===id);
  const add=document.getElementById("addLg");
  if(add) add.onclick=()=>{ leagues.push(newLeague()); saveLeagues(); renderLeagues(); };
  host.querySelectorAll("[data-name]").forEach(el=>{
    el.onchange=()=>{ const lg=L(el.dataset.name); lg.name=el.value.trim()||"Untitled league"; saveLeagues(); };
    el.onkeydown=e=>{ if(e.key==="Enter") el.blur(); };
  });
  host.querySelectorAll("[data-cfg]").forEach(b=>b.onclick=()=>{ const lg=L(b.dataset.cfg); lg.open=!lg.open; renderLeagues(); });
  host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const lg=L(b.dataset.del);
    if(confirm('Delete "'+lg.name+'"? This can\'t be undone.')){ leagues=leagues.filter(x=>x.id!==lg.id); saveLeagues(); renderLeagues(); }
  });
  host.querySelectorAll("[data-sc]").forEach(s=>s.onchange=()=>{ L(s.dataset.sc).scoring=s.value; saveLeagues(); renderLeagues(); });
  host.querySelectorAll("[data-slot]").forEach(inp=>inp.onchange=()=>{
    const [id,k]=inp.dataset.slot.split("|");
    L(id).slots[k]=Math.max(0,Math.min(4,+inp.value||0)); saveLeagues(); renderLeagues();
  });
  host.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    const [id,w]=b.dataset.jump.split("|"); leagueWeek[id]=+w; renderLeagues();
  });
  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [id,pid]=b.dataset.drop.split("|");
    const lg=L(id); lg.roster=lg.roster.filter(x=>x!==pid); saveLeagues(); renderLeagues();
  });
  host.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openSheet(el.dataset.open));
  host.querySelectorAll("[data-add]").forEach(inp=>{
    const id=inp.dataset.add, res=document.getElementById("res-"+id);
    let t;
    const draw=()=>{
      const s=inp.value.trim().toLowerCase();
      if(!s){ res.innerHTML=""; return; }
      const lg=L(id);
      const hits=Object.keys(P).filter(pid=>!lg.roster.includes(pid)&&
        (P[pid].n.toLowerCase().includes(s)||P[pid].t.toLowerCase().includes(s))).slice(0,6);
      res.innerHTML=hits.length
        ? hits.map(pid=>'<button class="lhit" data-pick="'+id+'|'+pid+'">'+por(pid,"sm")
            +'<span>'+P[pid].n+'<em>'+P[pid].p+' · '+P[pid].t+'</em></span></button>').join('')
        : '<div class="lhit none">No active player matches.</div>';
      res.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
        const [lid,pid]=b.dataset.pick.split("|");
        const lg2=L(lid); if(!lg2.roster.includes(pid)) lg2.roster.push(pid);
        saveLeagues(); renderLeagues();
      });
    };
    inp.oninput=()=>{ clearTimeout(t); t=setTimeout(draw,140); };
  });
}

/* =================== Player sheet =================== */
function openSheet(pid){
  const p=P[pid]; if(!p) return;
  const log=logOf(pid), t=seasonTotals(pid);
  const other=season===2026?2025:2026, oLog=logOf(pid,other);
  let h='<div class="sheet-h">'+por(pid)
    +'<div><h2>'+p.n+'</h2><div class="sheet-sub"><span class="pos" style="--pc:'+(PC[p.p]||'var(--mid)')+'">'+p.p+'</span>'
    +'<span>'+p.t+(p.j?' · #'+p.j:'')+'</span>'+(p.y?'<span>'+(p.y==="0"?"rookie":p.y+" yr")+'</span>':'')
    +(p.c?'<span>'+p.c.split(";")[0]+'</span>':'')+'</div></div>'
    +'<button class="closeb" id="closeSheet">✕</button></div>';
  // KPIs
  const kp=[["Games",t.g],["PPG",t.g?t.ppg.toFixed(1):"–"],["Fantasy",t.g?t.fp.toFixed(0):"–"],["Total TD",t.td]];
  if(p.p==="QB") kp.push(["Pass yds",t.pyd],["Pass TD",t.ptd]);
  else if(p.p==="RB") kp.push(["Rush yds",t.ryd],["Rec",t.rec]);
  else kp.push(["Rec",t.rec],["Rec yds",t.cyd]);
  h+='<div class="kpis">'+kp.map(([l,v])=>'<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>';
  // weekly log
  h+='<div class="sect"><h3>'+season+' game log<small>'+scoring.toUpperCase()+' scoring</small></h3>';
  if(!log.length) h+='<div class="empty" style="padding:22px 0">No '+season+' stat lines yet.</div>';
  else{
    const cols=p.p==="QB"
      ? [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["C/A",r=>r[C.cmp]+"/"+r[C.att],1],["Yds",r=>r[C.pyd]],["TD",r=>r[C.ptd]],["INT",r=>r[C.int]],["Car",r=>r[C.car]],["RuYd",r=>r[C.ryd]],["RuTD",r=>r[C.rtd]],["FP",fp,0,1]]
      : p.p==="K"
      ? [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["FG",r=>r[C.fg]],["XP",r=>r[C.pat]],["FP",fp,0,1]]
      : [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["Car",r=>r[C.car]],["RuYd",r=>r[C.ryd]],["RuTD",r=>r[C.rtd]],["Tgt",r=>r[C.tgt]],["Rec",r=>r[C.rec]],["RecYd",r=>r[C.cyd]],["RecTD",r=>r[C.ctd]],["FP",fp,0,1]];
    h+='<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th class="'+(c[2]?'l':'')+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>';
    for(const r of log){
      h+='<tr>'+cols.map(c=>{ const v=c[1](r); const s=c[3]?Number(v).toFixed(1):v;
        return '<td class="'+(c[2]?'l':'')+' '+(v===0?'zero':'')+'">'+(v===0?'–':s)+'</td>'; }).join('')+'</tr>';
    }
    const sum=cols.map((c,i)=>{ if(i===0) return '<td class="l" style="color:var(--dim)">Tot</td>'; if(i===1) return '<td class="l"></td>';
      if(c[0]==="C/A") return '<td></td>';
      const v=log.reduce((a,r)=>a+(+c[1](r)||0),0); return '<td style="color:var(--chalk);font-weight:600">'+(c[3]?v.toFixed(1):v)+'</td>'; }).join('');
    h+='</tbody><tfoot><tr style="border-top:1px solid var(--rule2)">'+sum+'</tr></tfoot></table></div>';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap">'
      +stripHtml(pid)
      +'<div class="legend">cold<i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>hot</div></div>';
  }
  h+='</div>';
  if(oLog.length){
    const ot=(()=>{ const s=season; season=other; const r=seasonTotals(pid); season=s; return r; })();
    h+='<div class="sect" style="border-top:1px solid var(--rule)"><h3>'+other+' for comparison</h3>'
      +'<div class="kpis" style="border:1px solid var(--rule);border-radius:9px;overflow:hidden">'
      +[["Games",ot.g],["PPG",ot.ppg.toFixed(1)],["Fantasy",ot.fp.toFixed(0)],["Total TD",ot.td]]
        .map(([l,v])=>'<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div></div>';
  }
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("veil").classList.add("show");
  document.getElementById("closeSheet").onclick=closeSheet;
}
function closeSheet(){ document.getElementById("veil").classList.remove("show"); }
document.getElementById("veil").addEventListener("click",e=>{ if(e.target.id==="veil") closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* =================== Prefs =================== */
const LS="snapcount.prefs";
function savePrefs(){
  if(!loaded) return;
  const dot=document.getElementById("saveDot"); dot.className="savedot busy";
  try{ localStorage.setItem(LS,JSON.stringify({season,scoring,view,posF,teamF,weekF,filters,sortKey,sortDir}));
       dot.className="savedot on"; dot.title="Preferences saved in this browser";
  }catch(e){ dot.className="savedot err"; dot.title="Couldn't save preferences"; }
}
function loadPrefs(){
  try{
    const s=JSON.parse(localStorage.getItem(LS)||"{}");
    if(s.season&&[2026,2025].includes(+s.season)) season=+s.season;
    if(["ppr","half","std"].includes(s.scoring)) scoring=s.scoring;
    if(["players","finder","leagues"].includes(s.view)) view=s.view;
    if(s.posF) posF=s.posF; if(s.teamF) teamF=s.teamF; if(s.weekF) weekF=s.weekF;
    if(Array.isArray(s.filters)) filters=s.filters;
    if(s.sortKey) sortKey=s.sortKey; if(s.sortDir) sortDir=s.sortDir;
    document.getElementById("saveDot").className="savedot on";
  }catch(e){}
  document.getElementById("seasonSel").value=season;
  document.querySelectorAll("#scoreSeg button").forEach(b=>b.classList.toggle("on",b.dataset.s===scoring));
  document.querySelectorAll("#viewSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
}

/* =================== Wiring =================== */
function render(){
  document.getElementById("seasonTag").textContent=season;
  document.getElementById("view-players").style.display=view==="players"?"":"none";
  document.getElementById("view-finder").style.display=view==="finder"?"":"none";
  document.getElementById("view-leagues").style.display=view==="leagues"?"":"none";
  if(view==="players") renderPlayers();
  else if(view==="finder") renderFinder();
  else renderLeagues();
}
document.getElementById("viewSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  view=b.dataset.v;
  document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.toggle("on",x===b));
  render(); savePrefs();
});
document.getElementById("scoreSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  scoring=b.dataset.s;
  document.querySelectorAll("#scoreSeg button").forEach(x=>x.classList.toggle("on",x===b));
  invalidate(); render(); savePrefs();
});
document.getElementById("seasonSel").addEventListener("change",e=>{
  season=+e.target.value; weekF="all"; shown=PAGE; invalidate(); note("Data"); render(); savePrefs();
});
boot();
