<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snap Count — NFL player stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1216; --surface:#171C22; --surface2:#1D242C; --rule:#252D37; --rule2:#333E4B;
  --chalk:#EAEEF3; --mid:#93A3B4; --dim:#5E6E80;
  --qb:#F4646E; --rb:#3FD0A0; --wr:#4C9AFF; --te:#FFB03A; --k:#B98CFF;
  --h0:#1C2531; --h1:#274C63; --h2:#2C6A8C; --h3:#D98A32; --h4:#FF5A36;
  --good:#3FD0A0; --warn:#FFB03A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--chalk);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--wr);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- masthead ---------- */
header{position:sticky;top:0;z-index:40;background:#0F1216;border-bottom:1px solid var(--rule)}
.mast{display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:9px;font-family:'Barlow Condensed',sans-serif}
.wordmark b{font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1}
.wordmark span{font-size:12px;color:var(--dim);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.hashes{display:flex;gap:3px;align-items:flex-end;height:20px}
.hashes i{width:2px;background:var(--rule2);display:block}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{padding:7px 13px;font-size:12.5px;color:var(--mid);font-weight:500}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--surface2);color:var(--chalk)}
.seg button:hover:not(.on){color:var(--chalk)}
.ctl{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:7px 11px;font-size:13px}
.ctl:hover{border-color:var(--rule2)}
select.ctl{cursor:pointer}
.savedot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;transition:background .2s}
.savedot.on{background:var(--good)} .savedot.busy{background:var(--warn)} .savedot.err{background:var(--qb)}
.who{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}

/* ---------- shell ---------- */
main{max-width:1560px;margin:0 auto;padding:20px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 12px;min-width:210px;flex:1;max-width:340px;font-size:13px}
.search::placeholder{color:var(--dim)}
.chip{padding:6px 11px;border:1px solid var(--rule);border-radius:20px;font-size:12px;color:var(--mid);font-family:'IBM Plex Mono',monospace}
.chip.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk);font-weight:600}
.chip:hover:not(.on){border-color:var(--rule2);color:var(--chalk)}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin-left:auto}

/* ---------- player tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.tile{content-visibility:auto;contain-intrinsic-size:214px;position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:15px 10px 10px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
.tile:hover{background:var(--surface2);border-color:var(--rule2)}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--pc);border-radius:11px 11px 0 0}
.por{width:74px;height:74px;margin:0 auto;border-radius:50%;overflow:hidden;background:#202935;border:2px solid var(--pc);display:flex;align-items:center;justify-content:center}
.por img{width:100%;height:100%;object-fit:cover;object-position:top center}
.por .ini{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--mid)}
.t-name{margin-top:9px;font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.t-meta{margin-top:5px;display:flex;justify-content:center;gap:6px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mid)}
.pos{font-weight:600;font-size:10px;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);border-radius:4px;padding:1px 5px}
.t-line{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.t-line b{color:var(--chalk);font-size:13px;font-weight:600}
/* heat strip — the signature element */
.strip{display:flex;gap:1.5px;margin-top:9px;height:16px}
.strip i{flex:1;border-radius:2px;background:var(--h0);display:block}
.strip i[data-h="1"]{background:var(--h1)} .strip i[data-h="2"]{background:var(--h2)}
.strip i[data-h="3"]{background:var(--h3)} .strip i[data-h="4"]{background:var(--h4)}
.strip i.dnp{background:repeating-linear-gradient(45deg,#1A2029,#1A2029 2px,transparent 2px,transparent 4px)}

/* ---------- data table ---------- */
.tbl-wrap{border:1px solid var(--rule);border-radius:11px;overflow:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--mid);font-weight:600;font-size:12px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;z-index:2}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--chalk)}
thead th.sorted{color:var(--chalk);box-shadow:inset 0 -2px 0 var(--wr)}
tbody td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
tbody td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.who-cell{display:flex;align-items:center;gap:12px;font-family:'IBM Plex Sans',sans-serif}
.who-cell .por{width:44px;height:44px;border-width:2px}
.tbl-wrap{contain:content}
.who-cell .por .ini{font-size:16px}
.who-cell b{font-weight:600;font-size:15.5px;line-height:1.25}
.sub{color:var(--mid);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-top:2px}
td.hot{color:var(--h4);font-weight:600}
td.zero{color:#3C4854}

/* ---------- filter workbench ---------- */
.work{display:grid;grid-template-columns:268px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.work{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:11px;overflow:hidden}
.panel-h{padding:11px 14px;border-bottom:1px solid var(--rule);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-h small{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);font-weight:400}
.fgroup{padding:12px 14px;border-bottom:1px solid var(--rule)}
.fgroup:last-child{border-bottom:none}
.flab{font-size:12.5px;color:var(--mid);margin-bottom:8px;font-family:'IBM Plex Mono',monospace}
.frow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.frow:last-child{margin-bottom:0}
.frow select,.frow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 9px;font-size:13.5px;font-family:'IBM Plex Mono',monospace}
.frow .x{color:var(--dim);font-size:13px;padding:0 2px}
.frow .x:hover{color:var(--qb)}
.preset{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:6px;font-size:13.5px;color:var(--mid);border:1px solid transparent}
.preset:hover{background:var(--surface2);color:var(--chalk);border-color:var(--rule)}
.addbtn{width:100%;padding:9px;border:1px dashed var(--rule2);border-radius:6px;font-size:13px;color:var(--mid);font-family:'IBM Plex Mono',monospace}
.addbtn:hover{color:var(--chalk);border-color:var(--chalk)}

/* ---------- detail sheet ---------- */
/* ---------- league cards ---------- */
.acc{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.acch b{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;display:block}
.acch span{font-size:12.5px;color:var(--mid);display:block;margin-top:3px}
.accgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 10px}
.accbox{background:var(--ink);border:1px solid var(--rule);border-radius:9px;padding:11px 13px}
.accbox b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600}
.accbox span{font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.accbox.win{border-color:color-mix(in srgb,var(--good) 45%,transparent)} .accbox.win b{color:var(--good)}
.accnote{font-size:12.5px;color:var(--mid);line-height:1.6}
.cf{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--rule)}
.cf.hi{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.cf.mid{color:var(--te);border-color:color-mix(in srgb,var(--te) 40%,transparent)}
.cf.lo{color:var(--dim)}
.whycell{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:var(--mid);white-space:normal;max-width:260px}
thead th input{width:34px;background:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:1px 3px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px}
.projbar{background:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.projmain{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.projmain b{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;color:var(--good)}
.projmain span{font-size:12.5px;color:var(--mid)}
.projrange{display:flex;align-items:center;gap:10px}
.pf,.pc{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim)}
.ptrack{flex:1;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--h1),var(--h2),var(--h3),var(--h4));position:relative}
.ptrack i{position:absolute;top:-3px;width:3px;height:14px;background:var(--chalk);border-radius:2px}
.sline{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sgrp{background:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:11px 13px}
.sgt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.sstat{text-align:center;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:9px 6px}
.sstat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.1}
.sstat span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mid);margin-top:2px}
.sstat em{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:3px}
.whylist{margin:12px 0 0 18px;padding:0;color:var(--mid);font-size:12.5px;line-height:1.7}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(372px,1fr));gap:16px;align-items:start}
@media(max-width:520px){.lgrid{grid-template-columns:1fr}}
.lcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.lhead{display:flex;align-items:center;gap:6px;padding:11px 12px;border-bottom:1px solid var(--rule)}
.lname{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:6px;padding:4px 7px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600}
.lname:hover{border-color:var(--rule)}
.lname:focus{border-color:var(--wr);outline:none;background:var(--ink)}
.lbtn{color:var(--dim);font-size:15px;padding:5px 7px;border-radius:6px}
.lbtn:hover{color:var(--chalk);background:var(--surface2)}
.lcfg{padding:12px 14px;background:var(--ink);border-bottom:1px solid var(--rule)}
.slotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slotf{display:flex;flex-direction:column;gap:4px;align-items:center}
.slotf span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mid)}
.slotf input{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px}
.lnote{margin-top:9px;font-size:11px;color:var(--dim);line-height:1.45}
.lfmt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mid);background:var(--ink);border:1px solid var(--rule);border-radius:20px;padding:3px 9px;flex:none;white-space:nowrap}
.lbtn.on{color:var(--wr);background:var(--surface2)}
.presetrow{display:flex;gap:6px}
.pbtn{flex:1;padding:7px 4px;border:1px solid var(--rule);border-radius:6px;font-size:12px;color:var(--mid);font-family:'IBM Plex Mono',monospace}
.pbtn:hover{border-color:var(--chalk);color:var(--chalk)}
.scgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.scgrid.b3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.scgrid{grid-template-columns:repeat(3,1fr)}}
.scf{display:flex;flex-direction:column;gap:4px}
.scf span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scf input{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px}
.scf input:focus{border-color:var(--wr);outline:none}
.ladd{padding:10px 12px;border-bottom:1px solid var(--rule);border-top:none;position:relative}
.lkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule)}
.lkpi{background:var(--surface);padding:11px 8px;text-align:center}
.lkpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.1}
.lkpi span{font-size:10px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lchart{display:flex;align-items:flex-end;gap:3px;padding:14px 12px 8px;border-bottom:1px solid var(--rule)}
.lbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.lbar i{width:100%;background:var(--h2);border-radius:2px 2px 0 0;display:block;transition:background .12s}
.lbar span{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim)}
.lbar:hover i{background:var(--h3)}
.lbar.on i{background:var(--h4)} .lbar.on span{color:var(--chalk)}
.lcall{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:11px}
.lcall .up{color:var(--good)} .lcall .dn{color:var(--qb)}
.lcall em{color:var(--dim);font-style:normal}
.lineup{padding:6px 0}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 12px}
.lrow:hover{background:var(--surface2)}
.lrow.bench{opacity:.72}
.lslot{width:38px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mid);background:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:3px 0;text-align:center}
.lslot.flex{color:var(--te);border-color:color-mix(in srgb,var(--te) 40%,transparent)}
.lslot.bn{color:var(--dim)}
.lrow .por{width:30px;height:30px;border-width:1.5px}
.lrow .por .ini{font-size:11px}
.lnm{flex:1;min-width:0;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnm em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lnm:hover{color:var(--wr)}
.lnm.empty{color:var(--dim);font-weight:400;font-style:italic;cursor:default}
.lpts{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;min-width:42px;text-align:right}
.lpts.dnp{color:#3C4854;font-weight:400}
.lx{color:transparent;font-size:11px;padding:2px 4px}
.lrow:hover .lx{color:var(--dim)}
.lx:hover{color:var(--qb)}
.lslot{cursor:pointer;transition:border-color .12s,color .12s}
button.lslot:hover{border-color:var(--chalk);color:var(--chalk)}
.lslot.on{background:var(--wr);border-color:var(--wr);color:#08131f;font-weight:600}
.lslot.bn{cursor:default}
.lrow.armed{background:rgba(76,154,255,.10);box-shadow:inset 2px 0 0 var(--wr)}
.lrow.elig{background:rgba(63,208,160,.07)}
.swapin{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 45%,transparent);border-radius:5px;padding:3px 8px;flex:none}
.swapin:hover{background:var(--good);color:#06211a}
.swapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;margin:4px 0;background:rgba(76,154,255,.10);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--wr)}
.sflag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--qb);border:1px solid color-mix(in srgb,var(--qb) 45%,transparent);border-radius:3px;padding:0 3px;vertical-align:1px;margin-left:4px}
.mnl{color:var(--wr);font-weight:600}
.resetwk{float:right;font-size:10px;font-family:'IBM Plex Mono',monospace;padding:0 4px}
.ltr{color:transparent;font-size:12px;padding:2px 4px}
.lrow:hover .ltr{color:var(--wr)}
.ltr:hover{color:var(--chalk)}
.sigbox{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border-radius:10px;border:1px solid var(--rule);background:var(--ink)}
.sigbox b{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600}
.sigbox span{font-size:13px;color:var(--mid);line-height:1.5}
.sigbox.sell{border-color:color-mix(in srgb,var(--h3) 55%,transparent)} .sigbox.sell b{color:var(--h3)}
.sigbox.buy{border-color:color-mix(in srgb,var(--good) 55%,transparent)} .sigbox.buy b{color:var(--good)}
.sigbox.volatile b{color:var(--te)} .sigbox.steady b{color:var(--mid)} .sigbox.thin b{color:var(--dim)}
.shape{display:flex;flex-direction:column;gap:7px}
.shrow{display:flex;align-items:center;gap:10px}
.shbar{flex:1;height:7px;background:var(--ink);border-radius:4px;overflow:hidden;border:1px solid var(--rule)}
.shbar i{display:block;height:100%;background:var(--mid)}
.shrow.surplus .shbar i{background:var(--good)} .shrow.need .shbar i{background:var(--qb)}
.shnum{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mid);min-width:58px;text-align:right}
.shtag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);min-width:56px;text-align:right}
.shrow.surplus .shtag{color:var(--good)} .shrow.need .shtag{color:var(--qb)}
.tgtlist{display:flex;flex-direction:column;gap:2px}
.tgt{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer}
.tgt:hover{background:var(--surface2)}
.tgtmain{flex:1;min-width:0}
.tgtn{font-size:13.5px;font-weight:600}
.tgtm{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-top:2px}
.tgtv{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;min-width:52px;text-align:right}
.fills{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 45%,transparent);border-radius:3px;padding:1px 4px;vertical-align:1px}
.lbench{padding:8px 12px 4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);border-top:1px solid var(--rule);margin-top:4px}
.lempty{padding:20px 12px;text-align:center;color:var(--dim);font-size:12.5px}
.lsearch{width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:7px;padding:9px 11px;font-size:13px}
.lsearch:focus{border-color:var(--wr);outline:none}
.lres{margin-top:6px}
.lhit{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:13px}
.lhit:hover{background:var(--surface2)}
.lhit .por{width:28px;height:28px;border-width:1.5px}
.lhit .por .ini{font-size:10px}
.lhit em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.lhit.none{color:var(--dim);font-size:12px;padding:8px}
.veil{position:fixed;inset:0;background:rgba(8,10,13,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.veil.show{display:flex}
.sheet{background:var(--surface);border:1px solid var(--rule2);border-radius:14px;max-width:880px;width:100%;max-height:88vh;overflow:auto}
.sheet-h{display:flex;gap:15px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h .por{width:64px;height:64px}
.sheet-h h2{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1.05}
.sheet-sub{display:flex;gap:9px;align-items:center;margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mid);flex-wrap:wrap}
.closeb{margin-left:auto;align-self:flex-start;color:var(--dim);font-size:17px;padding:3px 7px}
.closeb:hover{color:var(--chalk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.sect{padding:16px 20px}
.sect h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;margin-bottom:11px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3 small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);font-weight:400}
.empty{padding:34px 20px;text-align:center;color:var(--dim);font-size:13px}
.legend{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.legend i{width:15px;height:9px;border-radius:2px;display:block}
.loading{padding:44px;text-align:center;color:var(--mid);font-family:'IBM Plex Mono',monospace;font-size:13px}
footer{max-width:1560px;margin:0 auto;padding:22px 20px 40px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--rule);margin-top:30px;line-height:1.7}
footer a{color:var(--mid)}
</style>

/* =================== My leagues =================== */
const LS_L="snapcount.leagues";
let leagues=[], leagueWeek={}, swapping={};   // leagueWeek[id]=week shown; swapping[id]={slotIdx}
function statusTag(pid){
  const st=P[pid]&&P[pid].s;
  return st?' <span class="sflag">'+st+'</span>':'';
}
const SLOT_KEYS=["QB","RB","WR","TE","FLEX","K","DST"];
const FLEX_OK=["RB","WR","TE"];

function loadLeagues(){
  try{ const v=JSON.parse(localStorage.getItem(LS_L)||"[]"); if(Array.isArray(v)) leagues=v.map(migrate); }catch(e){}
}
function saveLeagues(){

function newLeague(){
  return {id:"L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          name:"League "+(leagues.length+1), score:defScore(),
          slots:{QB:1,RB:2,WR:2,TE:1,FLEX:1,K:1,DST:1}, teams:12, roster:[], lineup:{}};
}
/* Fully custom scoring. Every league stores its own point values and the
   totals are derived from raw stat components, not the precomputed columns. */
const SCORE_FIELDS=[
  {k:"py", label:"Pass yd",   step:.01},
  {k:"ptd",label:"Pass TD",   step:.5},
  {k:"int",label:"INT",       step:.5},
  {k:"ry", label:"Rush yd",   step:.01},
  {k:"rtd",label:"Rush TD",   step:.5},
  {k:"rec",label:"Reception", step:.5},
  {k:"cy", label:"Rec yd",    step:.01},
  {k:"ctd",label:"Rec TD",    step:.5},
  {k:"fum",label:"Fum lost",  step:.5},
  {k:"fg", label:"FG made",   step:.5},
  {k:"xp", label:"XP made",   step:.5},
  {k:"sptd",label:"Return TD", step:.5},
  {k:"two",label:"2-pt conv",  step:.5}
];
const DST_FIELDS=[
  {k:"dsk", label:"Sack",      step:.5},
  {k:"dint",label:"INT",       step:.5},
  {k:"dfr", label:"Fum rec",   step:.5},
  {k:"dtd", label:"Def TD",    step:1},
  {k:"dsaf",label:"Safety",    step:1},
  {k:"dst_st",label:"Return TD",step:1}
];
// Points-allowed tiers, the near-universal default
const PA_TIERS=[[0,10],[6,7],[13,4],[20,1],[27,0],[34,-1],[99,-4]];
const BONUS_FIELDS=[
  {k:"b300p",label:"300+ pass yd"},
  {k:"b100r",label:"100+ rush yd"},
  {k:"b100c",label:"100+ rec yd"}
];
const PRESETS_SC={
  ppr: {py:.04,ptd:4,int:-2,ry:.1,rtd:6,rec:1,cy:.1,ctd:6,fum:-2,fg:3,xp:1,sptd:6,two:2,b300p:0,b100r:0,b100c:0,dsk:1,dint:2,dfr:2,dtd:6,dsaf:2,dst_st:6,dpa:1},
  half:{py:.04,ptd:4,int:-2,ry:.1,rtd:6,rec:.5,cy:.1,ctd:6,fum:-2,fg:3,xp:1,sptd:6,two:2,b300p:0,b100r:0,b100c:0,dsk:1,dint:2,dfr:2,dtd:6,dsaf:2,dst_st:6,dpa:1},
  std: {py:.04,ptd:4,int:-2,ry:.1,rtd:6,rec:0,cy:.1,ctd:6,fum:-2,fg:3,xp:1,sptd:6,two:2,b300p:0,b100r:0,b100c:0,dsk:1,dint:2,dfr:2,dtd:6,dsaf:2,dst_st:6,dpa:1}
};
const defScore=()=>({...PRESETS_SC.ppr});
function scoreRow(r,sc){
  let v = r[C.pyd]*(+sc.py||0) + r[C.ptd]*(+sc.ptd||0) + r[C.int]*(+sc.int||0)
        + r[C.ryd]*(+sc.ry||0) + r[C.rtd]*(+sc.rtd||0)
        + r[C.rec]*(+sc.rec||0) + r[C.cyd]*(+sc.cy||0) + r[C.ctd]*(+sc.ctd||0)
        + r[C.fum]*(+sc.fum||0) + r[C.fg]*(+sc.fg||0) + r[C.pat]*(+sc.xp||0)
        + (r[C.sptd]||0)*(+sc.sptd||0) + (r[C.two]||0)*(+sc.two||0);
  if(r[C.pyd]>=300) v+=(+sc.b300p||0);
  if(r[C.ryd]>=100) v+=(+sc.b100r||0);
  if(r[C.cyd]>=100) v+=(+sc.b100c||0);
  return Math.round(v*100)/100;
}
function scoreDst(r,sc){
  let v = r[D.sk]*(+sc.dsk||0) + r[D.int]*(+sc.dint||0) + r[D.fr]*(+sc.dfr||0)
        + r[D.td]*(+sc.dtd||0) + r[D.saf]*(+sc.dsaf||0) + r[D.sptd]*(+sc.dst_st||0);
  if((+sc.dpa)!==0 && r[D.pa]>=0){                 // -1 means the score wasn't available
    for(const [cap,pts] of PA_TIERS){ if(r[D.pa]<=cap){ v+=pts*(+sc.dpa||0); break; } }
  }
  return Math.round(v*100)/100;
}
// Older cards stored scoring as a string — bring them forward.
function migrate(lg){
  if(!lg.score){ lg.score = PRESETS_SC[lg.scoring] ? {...PRESETS_SC[lg.scoring]} : defScore(); delete lg.scoring; }
  for(const f of [...SCORE_FIELDS,...BONUS_FIELDS,...DST_FIELDS]) if(lg.score[f.k]===undefined) lg.score[f.k]=PRESETS_SC.ppr[f.k]||0;
  if(lg.score.dpa===undefined) lg.score.dpa=1;
  if(lg.slots.DST===undefined) lg.slots.DST=0;
  if(!lg.teams) lg.teams=12;
  if(!lg.lineup) lg.lineup={};
  return lg;
}
function presetName(sc){
  for(const [k,v] of Object.entries(PRESETS_SC))
    if(Object.keys(v).every(f=>Math.abs((+sc[f]||0)-v[f])<1e-9)) return k==="ppr"?"Full PPR":k==="half"?"Half PPR":"Standard";
  return "Custom";
}
/* Optimal lineup for one week: fill dedicated slots with the best at each
   position, then FLEX takes the best remaining RB/WR/TE. */
function ptsFor(pid,wk,sc){
  if(pid&&pid.startsWith("DST_")){
    const r=dstLog(pid).find(x=>x[D.wk]===wk);
    return {pts:r?scoreDst(r,sc):0,played:!!r};
  }
  const r=logOf(pid).find(x=>x[C.wk]===wk);
  return {pts:r?scoreRow(r,sc):0,played:!!r};
}
// The slot list a lineup is built from, e.g. [QB,RB,RB,WR,WR,TE,FLEX,K,DST]
function slotList(lg){
  const out=[];
  for(const s of SLOT_KEYS) for(let i=0;i<(lg.slots[s]||0);i++) out.push(s);
  return out;
}
const slotOk=(slot,pos)=>slot==="FLEX"?FLEX_OK.includes(pos):pos===slot;
/* Auto-fills the best legal lineup, then applies any manual placements the
   user has made for this week. Manual picks win; everything else re-optimizes
   around them. */
function lineupFor(lg,wk){
  const pool={};
  for(const pid of lg.roster){
    const p=P[pid]; if(!p) continue;
    const {pts,played}=ptsFor(pid,wk,lg.score);
    pool[pid]={pid,pos:p.p,pts,played};
  }
  const slots=slotList(lg);
  const manual=(lg.lineup||{})[wk]||{};        // {slotIndex: pid}
  const used=new Set(), start=new Array(slots.length).fill(null);
  // 1. honour manual placements that are still legal
  for(const k in manual){
    const i=+k, pid=manual[k];
    if(!slots[i]||!pool[pid]||used.has(pid)) continue;
    if(!slotOk(slots[i],pool[pid].pos)) continue;
    start[i]={slot:slots[i],...pool[pid],manual:true};
    used.add(pid);
  }
  // 2. auto-fill the rest, best first
  slots.forEach((slot,i)=>{
    if(start[i]) return;
    const best=Object.values(pool).filter(c=>!used.has(c.pid)&&slotOk(slot,c.pos)).sort((a,b)=>b.pts-a.pts)[0];
    if(best){ used.add(best.pid); start[i]={slot,...best}; }
    else start[i]={slot,pid:null,pts:0,played:false};
  });
  const bench=Object.values(pool).filter(c=>!used.has(c.pid)).sort((a,b)=>b.pts-a.pts);
  const total=start.reduce((s,x)=>s+x.pts,0);
  return {start,bench,total,slots};
}
/* Swap: put pid into slot i for this week. Anyone displaced goes to bench,
   unless we're swapping with a starter, in which case they trade places. */
function placeIn(lg,wk,slotIdx,pid){
  lg.lineup=lg.lineup||{};
  const wkMap={...(lg.lineup[wk]||{})};
  const cur=lineupFor(lg,wk);
  const occupant=cur.start[slotIdx]?cur.start[slotIdx].pid:null;
  // if the incoming player is starting elsewhere, trade the two slots
  const fromIdx=cur.start.findIndex(s=>s&&s.pid===pid);
  if(fromIdx>=0&&fromIdx!==slotIdx){
    if(occupant&&slotOk(cur.slots[fromIdx],P[occupant].p)) wkMap[fromIdx]=occupant;
    else delete wkMap[fromIdx];
  }
  wkMap[slotIdx]=pid;
  // drop any stale entries pointing at the same player twice
  for(const k in wkMap) if(+k!==slotIdx&&wkMap[k]===pid) delete wkMap[k];
  lg.lineup[wk]=wkMap;
}
function clearWeek(lg,wk){ if(lg.lineup) delete lg.lineup[wk]; }
function leagueSeason(lg){
  const wks=weeksIn(season);
  const byWeek=wks.map(w=>({w,total:lineupFor(lg,w).total}));
  const played=byWeek.filter(x=>x.total>0);
  const total=byWeek.reduce((s,x)=>s+x.total,0);
  // best / worst single starter performance across the season
  let best=null,worst=null;
  for(const w of wks){
    for(const s of lineupFor(lg,w).start){
      if(!s.pid||!s.played) continue;
      if(!best||s.pts>best.pts) best={...s,w};
      if(!worst||s.pts<worst.pts) worst={...s,w};
    }
  }
  return {byWeek,total,ppg:played.length?total/played.length:0,weeksPlayed:played.length,best,worst};
}

/* =================== Projection engine =================== */
/* Fantasy points are decomposed into opportunity x efficiency x TD rate,
   because those three behave very differently: opportunity is sticky,
   efficiency drifts, touchdowns are mostly noise. Each piece is shrunk
   toward a positional prior by sample size, then adjusted for the game
   environment (Vegas implied total, script) and the opponent. */
const S={id:0,wk:1,pct:2,snaps:3};
const G={tm:0,wk:1,opp:2,home:3,spread:4,total:5,imp:6,played:7,rest:8};
let HL=6;                                  // half-life in games for weighting
let K_SHRINK=5;                            // prior weight, in games
let LEAGUE_IMPLIED=22.5;
let USE_ENV=true, USE_SCRIPT=true;                   // average implied team total

/* The structural line is used directly. A component-backtest showed that
   blending each stat toward its trailing average lowers that stat's own error
   by a hair (carries 1.330 -> 1.325) but raises total-points error
   (5.12 -> 5.18), because shrinking every part flattens the sum. Keeping the
   structural line also means the displayed stat line and the displayed points
   are the same object, so they always reconcile. */
function actualPts(hist,sc){
  if(!hist.length) return 0;
  return hist.reduce((a,x)=>a+scoreRow(x.r,sc),0)/hist.length;
}
let snapIdx={}, schedIdx={}, _projCache=new Map();
function buildAux(){
  snapIdx={}; schedIdx={};
  for(const s of [2026,2025]){
    const m={};
    for(const r of (SNAPS[s]||[])) (m[r[S.id]]=m[r[S.id]]||{})[r[S.wk]]=r[S.pct];
    snapIdx[s]=m;
    const g={};
    for(const r of (SCHED[s]||[])) (g[r[G.tm]]=g[r[G.tm]]||{})[r[G.wk]]=r;
    schedIdx[s]=g;
  }
}
const snapPct=(pid,s,wk)=>((snapIdx[s]||{})[pid]||{})[wk];
const gameOf=(team,s,wk)=>((schedIdx[s]||{})[team]||{})[wk];
function nextWeek(){
  const rows=SCHED[2026]||[];
  const un=rows.filter(r=>!r[G.played]).map(r=>r[G.wk]);
  return un.length?Math.min(...un):(weeksIn(2026).slice(-1)[0]||1)+1;
}
/* Positional priors, derived from the league-wide pool rather than hardcoded */
let _priors=null;
function priors(){
  if(_priors) return _priors;
  const acc={};
  for(const s of [2025,2026]) for(const r of (WK[s]||[])){
    const p=P[r[C.id]]; if(!p||p.p==="DST") continue;
    const a=acc[p.p]=acc[p.p]||{car:0,ryd:0,rtd:0,tgt:0,rec:0,cyd:0,ctd:0,att:0,pyd:0,ptd:0,int:0,g:0};
    a.car+=r[C.car]; a.ryd+=r[C.ryd]; a.rtd+=r[C.rtd];
    a.tgt+=r[C.tgt]; a.rec+=r[C.rec]; a.cyd+=r[C.cyd]; a.ctd+=r[C.ctd];
    a.att+=r[C.att]; a.pyd+=r[C.pyd]; a.ptd+=r[C.ptd]; a.int+=r[C.int]; a.g++;
  }
  _priors={};
  for(const pos in acc){ const a=acc[pos];
    _priors[pos]={
      ypc:a.car?a.ryd/a.car:4.2, rtdPer:a.car?a.rtd/a.car:.03,
      catch:a.tgt?a.rec/a.tgt:.65, ypt:a.tgt?a.cyd/a.tgt:7.8, ctdPer:a.tgt?a.ctd/a.tgt:.055,
      ypa:a.att?a.pyd/a.att:7.0, ptdPer:a.att?a.ptd/a.att:.045, intPer:a.att?a.int/a.att:.025,
      carPg:a.g?a.car/a.g:0, tgtPg:a.g?a.tgt/a.g:0, attPg:a.g?a.att/a.g:0 };
  }
  return _priors;
}
/* Fantasy points each defense allows to each position, relative to average.
   Heavily shrunk — defense-vs-position is a nudge, not a driver. */
let _dvpCache=new Map();
function dvp(sc,upToWeek){
  const key=JSON.stringify(sc)+"|"+upToWeek;
  const hit=_dvpCache.get(key); if(hit) return hit;
  const tot={}, cnt={}, all={}, allc={};
  const add=(s,limit)=>{ for(const r of (WK[s]||[])){
    if(limit&&!(s<2026||r[C.wk]<limit)) continue;
    const p=P[r[C.id]]; if(!p||p.p==="DST"||p.p==="K") continue;
    const pts=scoreRow(r,sc), d=r[C.opp], k=d+"|"+p.p;
    tot[k]=(tot[k]||0)+pts; cnt[k]=(cnt[k]||0)+1;
    all[p.p]=(all[p.p]||0)+pts; allc[p.p]=(allc[p.p]||0)+1;
  }};
  add(2025); add(2026,upToWeek);
  const out={};
  for(const k in tot){
    const pos=k.split("|")[1];
    const avg=allc[pos]?all[pos]/allc[pos]:0;
    const mine=tot[k]/cnt[k];
    const n=cnt[k], w=n/(n+40);                 // shrink hard toward 1.0
    out[k]=avg>0?1+w*((mine/avg)-1):1;
  }
  _dvpCache.set(key,out);
  return out;
}
function history(pid,season,beforeWeek){
  const out=[];
  for(const s of [2025,2026]){
    if(s>season) continue;
    for(const r of (logOf(pid,s)||[])){
      if(s===season&&beforeWeek&&r[C.wk]>=beforeWeek) continue;
      out.push({s,r,wk:r[C.wk]});
    }
  }
  return out;
}
function wAvg(items,get){
  let num=0,den=0;
  items.forEach((x,i)=>{ const k=Math.pow(.5,(items.length-1-i)/HL); num+=get(x)*k; den+=k; });
  return den?num/den:0;
}
const shrink=(rate,prior,n)=>(n*rate+K_SHRINK*prior)/(n+K_SHRINK);

/* Core projection for one player, one upcoming week. */
function project(pid,opts){
  const o=opts||{}, season=o.season||2026, wk=o.wk||nextWeek(), sc=o.score||PRESETS_SC.ppr;
  const p=P[pid];
  if(!p) return null;
  if(p.p==="DST"||p.p==="K") return projectSimple(pid,season,wk,sc);
  const hist=history(pid,season,wk);
  if(!hist.length) return {pid,wk,pts:0,floor:0,ceil:0,conf:0,games:0,why:["No games on record"],status:"none"};
  const pr=priors()[p.p]||priors().WR;
  const n=hist.length;
  // ---- opportunity (the sticky part)
  let car=wAvg(hist,x=>x.r[C.car]), tgt=wAvg(hist,x=>x.r[C.tgt]), att=wAvg(hist,x=>x.r[C.att]);
  // ---- efficiency & TD rates, shrunk toward the positional prior
  const sumC=hist.reduce((a,x)=>a+x.r[C.car],0), sumT=hist.reduce((a,x)=>a+x.r[C.tgt],0), sumA=hist.reduce((a,x)=>a+x.r[C.att],0);
  const ypc=shrink(sumC?hist.reduce((a,x)=>a+x.r[C.ryd],0)/sumC:pr.ypc, pr.ypc, sumC/12);
  const rtdP=shrink(sumC?hist.reduce((a,x)=>a+x.r[C.rtd],0)/sumC:pr.rtdPer, pr.rtdPer, sumC/12);
  const ypt=shrink(sumT?hist.reduce((a,x)=>a+x.r[C.cyd],0)/sumT:pr.ypt, pr.ypt, sumT/12);
  const cat=shrink(sumT?hist.reduce((a,x)=>a+x.r[C.rec],0)/sumT:pr.catch, pr.catch, sumT/12);
  const ctdP=shrink(sumT?hist.reduce((a,x)=>a+x.r[C.ctd],0)/sumT:pr.ctdPer, pr.ctdPer, sumT/12);
  const ypa=shrink(sumA?hist.reduce((a,x)=>a+x.r[C.pyd],0)/sumA:pr.ypa, pr.ypa, sumA/15);
  const ptdP=shrink(sumA?hist.reduce((a,x)=>a+x.r[C.ptd],0)/sumA:pr.ptdPer, pr.ptdPer, sumA/15);
  const intP=shrink(sumA?hist.reduce((a,x)=>a+x.r[C.int],0)/sumA:pr.intPer, pr.intPer, sumA/15);
  const why=[];
  // ---- role trend from snap share
  const snaps=hist.map(x=>snapPct(pid,x.s,x.wk)).filter(v=>v!==undefined);
  let roleMult=1;
  if(snaps.length>=4){
    const recent=snaps.slice(-3).reduce((a,b)=>a+b,0)/3;
    const base=snaps.reduce((a,b)=>a+b,0)/snaps.length;
    if(base>.05){
      roleMult=Math.max(.7,Math.min(1.3,1+((recent-base)/base)*0.6));
      if(roleMult>1.08) why.push("Snap share trending up ("+Math.round(base*100)+"% → "+Math.round(recent*100)+"%)");
      if(roleMult<0.92) why.push("Snap share trending down ("+Math.round(base*100)+"% → "+Math.round(recent*100)+"%)");
    }
  }
  car*=roleMult; tgt*=roleMult; att*=roleMult;
  // ---- game environment
  const g=gameOf(p.t,season,wk);
  let envMult=1, oppMult=1, opp=null, implied=null;
  if(g){
    opp=g[G.opp];
    if(g[G.imp]>=0){
      implied=g[G.imp];
      envMult=Math.max(.8,Math.min(1.25,1+((implied-LEAGUE_IMPLIED)/LEAGUE_IMPLIED)*0.55));
      if(envMult>1.05) why.push("High-scoring spot — "+implied.toFixed(1)+" implied team total");
      if(envMult<0.95) why.push("Low team total — "+implied.toFixed(1)+" implied");
    }
    if(g[G.spread]>-90){
      const s=g[G.spread];                       // positive = favored
      const script=Math.max(-1,Math.min(1,s/10));
      if(p.p==="RB"){ car*=1+script*0.12; tgt*=1-script*0.08;
        if(Math.abs(script)>.5) why.push(s>0?"Favored by "+s+" — positive run script":"Underdog by "+(-s)+" — fewer carries, more targets"); }
      else if(p.p==="QB"||p.p==="WR"||p.p==="TE"){ att*=1-script*0.08; tgt*=1-script*0.06; }
    }
    const d=dvp(sc,season===2026?wk:0)[opp+"|"+p.p];
    if(d!==undefined){ oppMult=d;
      if(d>1.08) why.push(opp+" has been generous to "+p.p+"s");
      if(d<0.92) why.push(opp+" has been tough on "+p.p+"s"); }
  } else why.push("No scheduled game found for week "+wk);
  // ---- assemble the expected stat line
  const line=[...Array(23).fill(0)];
  line[C.car]=car; line[C.ryd]=car*ypc; line[C.rtd]=car*rtdP*envMult;
  line[C.tgt]=tgt; line[C.rec]=tgt*cat; line[C.cyd]=tgt*ypt; line[C.ctd]=tgt*ctdP*envMult;
  line[C.att]=att; line[C.pyd]=att*ypa; line[C.ptd]=att*ptdP*envMult; line[C.int]=att*intP;
  let pts=scoreRow(line,sc)*oppMult;

  const actual=hist.map(x=>scoreRow(x.r,sc));
  // ---- availability
  const inj=INJ[pid], st=p.s||(inj?inj[1]:"");
  let status="", gate=1;
  if(p.s==="IR"||p.s==="PUP"||p.s==="INA"){ gate=0; status=p.s; why.unshift("On "+p.s+" — not expected to play"); }
  else if(inj){
    const s=inj[1];
    if(s==="Out"){ gate=0; status="Out"; why.unshift("Ruled out"); }
    else if(s==="Doubtful"){ gate=.25; status="Doubtful"; why.unshift("Doubtful — heavily discounted"); }
    else if(s==="Questionable"){ gate=.85; status="Questionable"; why.unshift("Questionable — modest discount"); }
  }
  const baseAvg=actualPts(hist,sc);
  if(g&&g[G.imp]>=0&&why.length===0) why.push("Implied team total "+g[G.imp].toFixed(1));
  pts*=gate;
  // the shown stat line is the same line the points came from, gated the same way
  const shownLine=line.map(v=>v*gate*oppMult);
  // ---- distribution from the player's own dispersion
  const mean=baseAvg;
  const sd=Math.sqrt(actual.reduce((a,b)=>a+(b-mean)*(b-mean),0)/actual.length);
  const cv=mean>0?Math.min(sd/mean,1.2):.6;
  const floor=Math.max(0,pts*(1-cv*0.85)), ceil=pts*(1+cv*1.05);
  // ---- confidence
  let conf=Math.min(1,n/8)*0.5 + (snaps.length>=3?0.2:0.05) + (g?0.15:0) + (1-Math.min(cv,1))*0.15;
  if(gate===0) conf=Math.max(conf,0.9);
  return {pid,wk,pts:Math.round(pts*10)/10,floor:Math.round(floor*10)/10,ceil:Math.round(ceil*10)/10,
          conf:Math.round(conf*100)/100,games:n,cv,mean,actual,opp,implied,status,gate,
          why:why.slice(0,4),line:shownLine,baseAvg,pos:p.p};
}
function projectSimple(pid,season,wk,sc){
  // Kickers and defenses: too few inputs to model, so weight recent output
  const isD=pid.startsWith("DST_");
  const rows=[];
  for(const s of [2025,2026]){
    const log=isD?dstLog(pid,s):logOf(pid,s);
    for(const r of log){ const w=isD?r[D.wk]:r[C.wk];
      if(s===season&&w>=wk) continue;
      rows.push(isD?scoreDst(r,sc):scoreRow(r,sc)); }
  }
  if(!rows.length) return {pid,wk,pts:0,floor:0,ceil:0,conf:0,games:0,why:["No games on record"],status:""};
  let num=0,den=0;
  rows.forEach((v,i)=>{ const k=Math.pow(.5,(rows.length-1-i)/HL); num+=v*k; den+=k; });
  const pts=num/den, mean=rows.reduce((a,b)=>a+b,0)/rows.length;
  const sd=Math.sqrt(rows.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rows.length);
  const cv=mean>0?Math.min(sd/mean,1.2):.6;
  const p=P[pid], g=p?gameOf(p.t,season,wk):null;
  const why=[isD?"Defense projections use recent scoring only":"Kicker projections use recent scoring only"];
  if(g&&g[G.imp]>=0&&isD) why.push("Opponent implied total "+(g[G.total]-g[G.imp]).toFixed(1));
  return {pid,wk,pts:Math.round(pts*10)/10,floor:Math.round(Math.max(0,pts*(1-cv*.85))*10)/10,
          ceil:Math.round(pts*(1+cv*1.05)*10)/10,conf:Math.round(Math.min(1,rows.length/8)*.6*100)/100,
          games:rows.length,cv,mean,actual:rows,opp:g?g[G.opp]:null,status:"",gate:1,why};
}
/* Probability of clearing a threshold, from the player's own shape of outcomes
   rescaled to the projection. */
function probOver(pj,x){
  if(!pj||!pj.actual||!pj.actual.length||pj.gate===0) return 0;
  const k=pj.mean>0?pj.pts/pj.mean:1;
  const hits=pj.actual.filter(v=>v*k>=x).length;
  return Math.round((hits/pj.actual.length)*100);
}
/* ---- Walk-forward backtest -------------------------------------------
   Predicts each week of 2025 using only games before it, then scores the
   model against two dumb baselines. If it can't beat last-3-games, it
   isn't worth trusting, and the UI says so. */
let _btCache=null;
function backtest(sc){
  if(_btCache&&_btCache.sig===JSON.stringify(sc)) return _btCache;
  const rows=[];
  const savedSeason=season;
  for(let wk=5;wk<=18;wk++){
    for(const pid in P){
      const p=P[pid];
      // Kickers and defenses don't go through the structural model at all
      // (see projectSimple), so scoring them here would measure the wrong thing.
      if(!p||p.p==="DST"||p.p==="K") continue;
      const act=logOf(pid,2025).find(r=>r[C.wk]===wk);
      if(!act) continue;
      const hist=logOf(pid,2025).filter(r=>r[C.wk]<wk);
      if(hist.length<3) continue;
      const actual=scoreRow(act,sc);
      // model, restricted to prior weeks of 2025
      const structural=projectBT(pid,wk,sc,hist);
      const seasonAvg=hist.reduce((a,r)=>a+scoreRow(r,sc),0)/hist.length;
      const l3=hist.slice(-3), last3=l3.reduce((a,r)=>a+scoreRow(r,sc),0)/l3.length;
      rows.push({actual,model:structural,structural,seasonAvg,last3});

  season=savedSeason;
  const mae=k=>rows.reduce((a,r)=>a+Math.abs(r[k]-r.actual),0)/rows.length;
  const corr=k=>{
    const n=rows.length;
    const mx=rows.reduce((a,r)=>a+r[k],0)/n, my=rows.reduce((a,r)=>a+r.actual,0)/n;
    let sxy=0,sx=0,sy=0;
    rows.forEach(r=>{const dx=r[k]-mx,dy=r.actual-my; sxy+=dx*dy; sx+=dx*dx; sy+=dy*dy;});
    return (sx&&sy)?sxy/Math.sqrt(sx*sy):0;
  };
  const out={sig:JSON.stringify(sc),n:rows.length,rows,
    model:{mae:mae("model"),r:corr("model")},
    last3:{mae:mae("last3"),r:corr("last3")},
    seasonAvg:{mae:mae("seasonAvg"),r:corr("seasonAvg")}};
  out.beatsLast3=out.model.mae<out.last3.mae;
  out.gain=((out.last3.mae-out.model.mae)/out.last3.mae)*100;
  _btCache=out;
  return out;
}
/* Trimmed projection used only by the backtest: same maths, 2025-only history,
   no injury gating (those reports are current-season). */
function projectBT(pid,wk,sc,hist,wantLine){
  const p=P[pid], pr=priors()[p.p]||priors().WR;
  const items=hist.map(r=>({r}));
  const w=(get)=>{ let num=0,den=0; items.forEach((x,i)=>{const k=Math.pow(.5,(items.length-1-i)/HL); num+=get(x.r)*k; den+=k;}); return den?num/den:0; };
  let car=w(r=>r[C.car]), tgt=w(r=>r[C.tgt]), att=w(r=>r[C.att]);
  const S_=(f)=>hist.reduce((a,r)=>a+r[f],0);
  const sumC=S_(C.car), sumT=S_(C.tgt), sumA=S_(C.att);
  const ypc=shrink(sumC?S_(C.ryd)/sumC:pr.ypc,pr.ypc,sumC/12);
  const rtdP=shrink(sumC?S_(C.rtd)/sumC:pr.rtdPer,pr.rtdPer,sumC/12);
  const ypt=shrink(sumT?S_(C.cyd)/sumT:pr.ypt,pr.ypt,sumT/12);
  const cat=shrink(sumT?S_(C.rec)/sumT:pr.catch,pr.catch,sumT/12);
  const ctdP=shrink(sumT?S_(C.ctd)/sumT:pr.ctdPer,pr.ctdPer,sumT/12);
  const ypa=shrink(sumA?S_(C.pyd)/sumA:pr.ypa,pr.ypa,sumA/15);
  const ptdP=shrink(sumA?S_(C.ptd)/sumA:pr.ptdPer,pr.ptdPer,sumA/15);
  const intP=shrink(sumA?S_(C.int)/sumA:pr.intPer,pr.intPer,sumA/15);
  let envMult=1,oppMult=1;
  const g=gameOf(p.t,2025,wk);
  if(g){
    if(USE_ENV&&g[G.imp]>=0) envMult=Math.max(.8,Math.min(1.25,1+((g[G.imp]-LEAGUE_IMPLIED)/LEAGUE_IMPLIED)*0.55));
    if(USE_SCRIPT&&g[G.spread]>-90){
      const script=Math.max(-1,Math.min(1,g[G.spread]/10));
      if(p.p==="RB"){ car*=1+script*0.12; tgt*=1-script*0.08; }
      else { att*=1-script*0.08; tgt*=1-script*0.06; }
    }
  }
  const line=[...Array(23).fill(0)];
  line[C.car]=car; line[C.ryd]=car*ypc; line[C.rtd]=car*rtdP*envMult;
  line[C.tgt]=tgt; line[C.rec]=tgt*cat; line[C.cyd]=tgt*ypt; line[C.ctd]=tgt*ctdP*envMult;
  line[C.att]=att; line[C.pyd]=att*ypa; line[C.ptd]=att*ptdP*envMult; line[C.int]=att*intP;
  return wantLine?line:scoreRow(line,sc)*oppMult;
}
/* Average absolute error per stat, measured walk-forward over 3,195

const COMP_MAE={car:1.33,ryd:8.1,rtd:.16,tgt:1.55,rec:1.21,cyd:16.5,ctd:.26,att:1.03,pyd:8.4,ptd:.13,int:.08};
function statLineHtml(pj){

  }
  if(L[C.tgt]>0.4||["WR","TE"].includes(p.p)){
    groups.push(["Receiving",[["Tgt",L[C.tgt],one,COMP_MAE.tgt],["Rec",L[C.rec],one,COMP_MAE.rec],
      ["Yds",L[C.cyd],v=>Math.round(v),COMP_MAE.cyd],["TD",L[C.ctd],two,COMP_MAE.ctd]]]);
  }

  let h='<div class="sline">';

  return h;
}

/* =================== Trade finder =================== */
/* Value is production-based, not a projection: it blends 2025 and 2026 with
   recent games weighted heavier, then measures each player against the
   replacement level at his own position so positions can be compared. */
const HALF_LIFE=7;                       // games; weight halves every 7 back
const FLEX_SHARE={RB:.5,WR:.35,TE:.15};
let _valCache=new Map();
function scoreSig(lg){ return JSON.stringify(lg.score)+"|"+(lg.teams||12)+"|"+JSON.stringify(lg.slots); }

function gameStream(pid,sc){
  // oldest → newest across both seasons
  const out=[];
  for(const s of [2025,2026]){
    const rows=pid.startsWith("DST_")?dstLog(pid,s):logOf(pid,s);
    for(const r of rows){
      const wk=pid.startsWith("DST_")?r[D.wk]:r[C.wk];
      out.push({season:s,wk,pts:pid.startsWith("DST_")?scoreDst(r,sc):scoreRow(r,sc)});
    }
  }
  return out;
}
function pct(sorted,p){
  if(!sorted.length) return 0;
  const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
function playerValue(pid,sc){
  const g=gameStream(pid,sc);
  if(!g.length) return {games:0,wppg:0,ppg:0,floor:0,ceil:0,cv:1,trend:0,recent:0};
  let wsum=0,w=0;
  g.forEach((x,i)=>{ const back=g.length-1-i, k=Math.pow(.5,back/HALF_LIFE); wsum+=x.pts*k; w+=k; });
  const wppg=w?wsum/w:0;
  const vals=g.map(x=>x.pts), sorted=[...vals].sort((a,b)=>a-b);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length);
  const last=g.slice(-3), recent=last.reduce((a,b)=>a+b.pts,0)/last.length;
  return {games:g.length, wppg, ppg:mean,
          floor:pct(sorted,.25), ceil:pct(sorted,.8),
          cv:mean>0?sd/mean:1, recent,
          trend:wppg>0?(recent-wppg)/wppg:0,
          lastSeason:g.filter(x=>x.season===2025).length,
          thisSeason:g.filter(x=>x.season===2026).length};
}
function valueModel(lg){
  const sig=scoreSig(lg);
  const hit=_valCache.get(sig); if(hit) return hit;
  const teams=lg.teams||12;
  const vals={};
  for(const pid in P) vals[pid]=playerValue(pid,lg.score);
  // replacement level per position
  const repl={};
  for(const pos of ["QB","RB","WR","TE","K","DST"]){
    const starters=(lg.slots[pos]||0)+(FLEX_OK.includes(pos)?(lg.slots.FLEX||0)*FLEX_SHARE[pos]:0);
    const rank=Math.max(1,Math.round(teams*starters));
    const pool=Object.keys(P).filter(id=>P[id].p===pos&&vals[id].games>=2)
      .map(id=>vals[id].wppg).sort((a,b)=>b-a);
    repl[pos]=pool.length?pool[Math.min(rank,pool.length-1)]:0;
  }
  for(const pid in P) vals[pid].vor=vals[pid].wppg-(repl[P[pid].p]||0);
  const out={vals,repl,teams};
  _valCache.set(sig,out);
  return out;
}
function signalOf(v){
  if(v.games<3) return {k:"thin",label:"Not enough games",note:"Fewer than three games on record — value here is unreliable."};
  if(v.trend>=.25) return {k:"sell",label:"Sell high",note:"Last three games are running "+Math.round(v.trend*100)+"% above his own baseline. If you doubt the role changed, this is the window to move him."};
  if(v.trend<=-.25) return {k:"buy",label:"Buy low",note:"Last three games are "+Math.round(Math.abs(v.trend)*100)+"% below his baseline. Cheaper now than his body of work says he's worth."};
  if(v.cv>=.75) return {k:"volatile",label:"Volatile",label2:true,note:"Week-to-week swings are wide — his ceiling sells better than his floor plays."};
  return {k:"steady",label:"Holding value",note:"Recent form is in line with his baseline. No obvious discount or premium right now."};
}
function rosterShape(lg,model){
  const out={};
  for(const pos of ["QB","RB","WR","TE","K","DST"]){
    const mine=lg.roster.filter(id=>P[id]&&P[id].p===pos)
      .map(id=>({id,v:model.vals[id]})).sort((a,b)=>b.v.wppg-a.v.wppg);
    const need=(lg.slots[pos]||0)+(FLEX_OK.includes(pos)?(lg.slots.FLEX||0)*FLEX_SHARE[pos]:0);
    const startable=mine.filter(m=>m.v.wppg>=(model.repl[pos]||0)).length;
    out[pos]={count:mine.length,need:Math.round(need*10)/10,startable,
              state: startable-need>=1 ? "surplus" : (startable<Math.floor(need)||!mine.length ? "need" : "set"),
              top:mine.slice(0,3)};
  }
  return out;
}
function tradeTargets(lg,pid,model,shape){
  const v=model.vals[pid];
  const band=Math.max(1.5,Math.abs(v.vor)*0.35);
  const needPos=Object.keys(shape).filter(p=>shape[p].state==="need");
  const cands=Object.keys(P).filter(id=>{
    if(id===pid||lg.roster.includes(id)) return false;
    const c=model.vals[id];

    return Math.abs(c.vor-v.vor)<=band;
  }).map(id=>({id,v:model.vals[id],fills:needPos.includes(P[id].p)}));
  cands.sort((a,b)=>(b.fills-a.fills)||(b.v.vor-a.v.vor));
  return cands.slice(0,12);
}

function openSheet(pid){

  const log=logOf(pid), t=seasonTotals(pid);
  const other=season===2026?2025:2026, oLog=logOf(pid,other);
  let h='<div class="sheet-h">'+por(pid)
    +'<div><h2>'+p.n+'</h2><div class="sheet-sub"><span class="pos" style="--pc:'+(PC[p.p]||'var(--mid)')+'">'+p.p+'</span>'
    +'<span>'+p.t+(p.j?' · #'+p.j:'')+'</span>'+(p.y?'<span>'+(p.y==="0"?"rookie":p.y+" yr")+'</span>':'')
    +(p.c?'<span>'+p.c.split(";")[0]+'</span>':'')+'</div></div>'
    +'<button class="closeb" id="closeSheet">✕</button></div>';
  // KPIs
  const kp=[["Games",t.g],["PPG",t.g?t.ppg.toFixed(1):"–"],["Fantasy",t.g?t.fp.toFixed(0):"–"],["Total TD",t.td]];
  if(p.p==="QB") kp.push(["Pass yds",t.pyd],["Pass TD",t.ptd]);
  else if(p.p==="RB") kp.push(["Rush yds",t.ryd],["Rec",t.rec]);
  else kp.push(["Rec",t.rec],["Rec yds",t.cyd]);
  h+='<div class="kpis">'+kp.map(([l,v])=>'<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>';
  // upcoming-week projection
  const pj=project(pid,{wk:nextWeek(),score:projScore()});
  if(pj&&pj.games){
    h+='<div class="sect"><h3>Week '+pj.wk+' outlook<small>'+(pj.opp?'vs '+pj.opp:'no game found')+'</small></h3>'
      +'<div class="projbar"><div class="projrange"><span class="pf">'+pj.floor.toFixed(1)+'</span>'
      +'<span class="ptrack"><i style="left:'+Math.max(0,Math.min(100,((pj.pts-pj.floor)/Math.max(pj.ceil-pj.floor,.1))*100))+'%"></i></span>'
      +'<span class="pc">'+pj.ceil.toFixed(1)+'</span></div>'
      +'<div class="projmain"><b>'+pj.pts.toFixed(1)+'</b><span>projected · '+probOver(pj,15)+'% chance of 15+ · '+Math.round(pj.conf*100)+'% confidence</span></div></div>'
      +(pj.why.length?'<ul class="whylist">'+pj.why.map(w=>'<li>'+w+'</li>').join('')+'</ul>':'')
      +statLineHtml(pj)
      +'</div>';
  }
  // weekly log
  h+='<div class="sect" style="border-top:1px solid var(--rule)"><h3>'+season+' game log<small>'+scoring.toUpperCase()+' scoring</small></h3>';
  if(!log.length) h+='<div class="empty" style="padding:22px 0">No '+season+' stat lines yet.</div>';
  else{
    const cols=p.p==="QB"
      ? [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["C/A",r=>r[C.cmp]+"/"+r[C.att],1],["Yds",r=>r[C.pyd]],["TD",r=>r[C.ptd]],["INT",r=>r[C.int]],["Car",r=>r[C.car]],["RuYd",r=>r[C.ryd]],["RuTD",r=>r[C.rtd]],["FP",fp,0,1]]
      : p.p==="K"
      ? [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["FG",r=>r[C.fg]],["XP",r=>r[C.pat]],["FP",fp,0,1]]
      : [["Wk",r=>r[C.wk]],["Opp",r=>r[C.opp],1],["Car",r=>r[C.car]],["RuYd",r=>r[C.ryd]],["RuTD",r=>r[C.rtd]],["Tgt",r=>r[C.tgt]],["Rec",r=>r[C.rec]],["RecYd",r=>r[C.cyd]],["RecTD",r=>r[C.ctd]],["FP",fp,0,1]];
    h+='<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th class="'+(c[2]?'l':'')+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>';
    for(const r of log){
      h+='<tr>'+cols.map(c=>{ const v=c[1](r); const s=c[3]?Number(v).toFixed(1):v;
        return '<td class="'+(c[2]?'l':'')+' '+(v===0?'zero':'')+'">'+(v===0?'–':s)+'</td>'; }).join('')+'</tr>';
    }
    const sum=cols.map((c,i)=>{ if(i===0) return '<td class="l" style="color:var(--dim)">Tot</td>'; if(i===1) return '<td class="l"></td>';
      if(c[0]==="C/A") return '<td></td>';
      const v=log.reduce((a,r)=>a+(+c[1](r)||0),0); return '<td style="color:var(--chalk);font-weight:600">'+(c[3]?v.toFixed(1):v)+'</td>'; }).join('');
    h+='</tbody><tfoot><tr style="border-top:1px solid var(--rule2)">'+sum+'</tr></tfoot></table></div>';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap">'
      +stripHtml(pid)
      +'<div class="legend">cold<i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>hot</div></div>';
  }
  h+='</div>';
  if(oLog.length){
    const ot=(()=>{ const s=season; season=other; const r=seasonTotals(pid); season=s; return r; })();
    h+='<div class="sect" style="border-top:1px solid var(--rule)"><h3>'+other+' for comparison</h3>'
      +'<div class="kpis" style="border:1px solid var(--rule);border-radius:9px;overflow:hidden">'
      +[["Games",ot.g],["PPG",ot.ppg.toFixed(1)],["Fantasy",ot.fp.toFixed(0)],["Total TD",ot.td]]
        .map(([l,v])=>'<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div></div>';
  }
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("veil").classList.add("show");
  document.getElementById("closeSheet").onclick=closeSheet;
}
function closeSheet(){ document.getElementById("veil").classList.remove("show"); }
document.getElementById("veil").addEventListener("click",e=>{ if(e.target.id==="veil") closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* =================== Prefs =================== */
const LS="snapcount.prefs";
function savePrefs(){
  if(!loaded) return;
  const dot=document.getElementById("saveDot"); dot.className="savedot busy";
  try{ localStorage.setItem(LS,JSON.stringify({season,scoring,view,posF,teamF,weekF,filters,sortKey,sortDir}));
       dot.className="savedot on"; dot.title="Preferences saved in this browser";
  }catch(e){ dot.className="savedot err"; dot.title="Couldn't save preferences"; }
}
function loadPrefs(){
  try{
    const s=JSON.parse(localStorage.getItem(LS)||"{}");
    if(s.season&&[2026,2025].includes(+s.season)) season=+s.season;
    if(["ppr","half","std"].includes(s.scoring)) scoring=s.scoring;
    if(["players","finder","leagues","week"].includes(s.view)) view=s.view;
    if(s.posF) posF=s.posF; if(s.teamF) teamF=s.teamF; if(s.weekF) weekF=s.weekF;
    if(Array.isArray(s.filters)) filters=s.filters;
    if(s.sortKey) sortKey=s.sortKey; if(s.sortDir) sortDir=s.sortDir;
    document.getElementById("saveDot").className="savedot on";
  }catch(e){}
  document.getElementById("seasonSel").value=season;
  document.querySelectorAll("#scoreSeg button").forEach(b=>b.classList.toggle("on",b.dataset.s===scoring));
  document.querySelectorAll("#viewSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
}

/* =================== Wiring =================== */
function render(){
  document.getElementById("seasonTag").textContent=season;
  document.getElementById("view-players").style.display=view==="players"?"":"none";
  document.getElementById("view-finder").style.display=view==="finder"?"":"none";
  document.getElementById("view-leagues").style.display=view==="leagues"?"":"none";
  document.getElementById("view-week").style.display=view==="week"?"":"none";
  if(view==="players") renderPlayers();
  else if(view==="finder") renderFinder();
  else if(view==="leagues") renderLeagues();
  else renderWeek();
}
document.getElementById("viewSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  view=b.dataset.v;
  document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.toggle("on",x===b));
  render(); savePrefs();
});
document.getElementById("scoreSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  scoring=b.dataset.s;
  document.querySelectorAll("#scoreSeg button").forEach(x=>x.classList.toggle("on",x===b));
  invalidate(); render(); savePrefs();
});
document.getElementById("seasonSel").addEventListener("change",e=>{
  season=+e.target.value; weekF="all"; shown=PAGE; invalidate(); note("Data"); render(); savePrefs();
});
boot();
</script>
</body>
